services:
  - type: web
    name: clave-linepithema
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clave-linepithema-db
          property: connectionString

databases:
  - name: clave-linepithema-db
    databaseName: linepithema
    user: linepithema_user
    plan: free