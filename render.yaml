services:
  - type: web
    name: clave-linepithema
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn_config.py backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        sync: false        # Se configura manualmente en el dashboard de Render
      - key: ADMIN_PASSWORD
        sync: false        # Se configura manualmente en el dashboard de Render
      - key: DATABASE_URL
        fromDatabase:
          name: clave-linepithema-db
          property: connectionString
      - key: ALLOWED_ORIGIN
        value: https://clave-linepithema.onrender.com

databases:
  - name: clave-linepithema-db
    databaseName: linepithema
    user: linepithema_user
    plan: free
