<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Clave Linepithema</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0A0E17;color:#E0E0E0;font-family:'Segoe UI',sans-serif;padding:20px;}
        .container{max-width:1400px;margin:0 auto;}
        h1{background:linear-gradient(45deg,#00D4FF,#7B61FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
        .subtitle{color:#A0A0B0;margin-bottom:30px;border-bottom:1px solid #00D4FF30;padding-bottom:10px;}
        .tabs{display:flex;gap:10px;margin-bottom:25px;flex-wrap:wrap;}
        .tab{padding:12px 25px;background:#1A1F36;border:1px solid #00D4FF40;border-radius:8px;cursor:pointer;font-weight:600;}
        .tab.active{background:linear-gradient(45deg,#00D4FF20,#7B61FF20);border-color:#00D4FF;color:#00D4FF;}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:25px;}
        .stat-card{background:#121826;border:1px solid #00D4FF40;border-radius:15px;padding:20px;text-align:center;}
        .stat-number{font-size:2rem;font-weight:bold;color:#00D4FF;}
        .card{background:#121826;border:1px solid #00D4FF40;border-radius:15px;padding:25px;margin-bottom:25px;}
        .card-title{color:#00D4FF;border-bottom:1px solid #00D4FF30;padding-bottom:10px;margin-bottom:20px;}
        .table-container{background:#121826;border:1px solid #00D4FF40;border-radius:15px;padding:20px;overflow-x:auto;}
        table{width:100%;border-collapse:collapse;}
        th{text-align:left;padding:12px;background:#1A1F36;color:#00D4FF;}
        td{padding:10px 12px;border-bottom:1px solid #1A1F36;}
        .badge{padding:4px 8px;border-radius:12px;font-size:0.8rem;}
        .badge-2d{background:#00D4FF20;color:#00D4FF;}
        .badge-2d-meta{background:#00D4FF40;color:#00D4FF;}
        .badge-3d{background:#7B61FF20;color:#7B61FF;}
        .badge-3d-meta{background:#7B61FF40;color:#7B61FF;}
        .btn-group{display:flex;gap:5px;flex-wrap:wrap;}
        .btn-small{padding:6px 12px;font-size:0.8rem;border:none;border-radius:5px;cursor:pointer;}
        .btn-2d{background:#00D4FF;color:#0A0E17;}
        .btn-2d-meta{background:#00D4FF80;color:#0A0E17;}
        .btn-3d{background:#7B61FF;color:white;}
        .btn-3d-meta{background:#7B61FF80;color:white;}
        .btn-danger{background:#FF375F;color:white;}
        .export-buttons{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
        .btn{padding:12px 24px;border:none;border-radius:8px;font-weight:600;cursor:pointer;}
        .btn-primary{background:linear-gradient(45deg,#00D4FF,#7B61FF);color:white;}
        .btn-secondary{background:#1A1F36;border:1px solid #00D4FF40;color:#00D4FF;}
        .btn:hover{transform:translateY(-2px);}
        .mensaje-flotante{position:fixed;bottom:20px;right:20px;background:#00D4FF;color:#0A0E17;padding:12px 20px;border-radius:8px;font-weight:bold;z-index:1000;animation:fadeOut 3s forwards;}
        @keyframes fadeOut{0%{opacity:1;}70%{opacity:1;}100%{opacity:0;}}
        .especies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px;}
        .especie-card{background:#1A1F36;border:2px solid #1A1F36;border-radius:10px;padding:15px;cursor:pointer;display:flex;align-items:center;gap:10px;}
        .especie-card.active{border-color:#00D4FF;background:linear-gradient(135deg,#00D4FF10,#7B61FF10);}
        @media (max-width:800px){.charts-grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
<div class="container">
    <h1>📊 Panel de Administración</h1>
    <div class="subtitle">Gestión de participantes y análisis de resultados</div>

    <!-- FIX: data-tab attribute para selección robusta de pestañas -->
    <div class="tabs">
        <div class="tab active" data-tab="usuarios" onclick="cambiarTab('usuarios')">👥 Usuarios</div>
        <div class="tab" data-tab="especies" onclick="cambiarTab('especies')">🔬 Especies Activas</div>
        <div class="tab" data-tab="estadisticas" onclick="cambiarTab('estadisticas')">📊 Estadísticas</div>
        <div class="tab" data-tab="graficos" onclick="cambiarTab('graficos')">📈 Gráficos</div>
        <div class="tab" data-tab="analisis" onclick="cambiarTab('analisis')">📉 Análisis Estadístico</div>
        <div class="tab" data-tab="detalles" onclick="cambiarTab('detalles')">🔍 Resultados Detallados</div>
        <div class="tab" data-tab="estadisticas_estudiante" onclick="cambiarTab('estadisticas_estudiante')">📋 Estadísticas por Estudiante</div>
        <div class="tab" data-tab="reflexiones" onclick="cambiarTab('reflexiones')">🧠 Reflexiones Metacognitivas</div>
    </div>

    <div class="export-buttons">
        <button class="btn btn-primary" onclick="exportarExcel()">📊 Exportar a Excel</button>
        <button class="btn btn-secondary" onclick="exportarCSV()">📥 Exportar CSV</button>
        <button class="btn btn-secondary" onclick="exportarJSON()">📥 Exportar JSON</button>
        <button class="btn btn-secondary" onclick="exportarReporteHTML()">📄 Ver Reporte HTML</button>
        <button class="btn btn-primary" onclick="window.location.href='/estadisticas'">📊 Estadísticas Avanzadas</button>
    </div>

    <div id="tabContent"></div>
</div>

<script>
    let usuarios = [], especiesConfig = { todas: [], activas: [] }, resultados = [], encuestas = [], reflexiones = [];

    document.addEventListener('DOMContentLoaded', () => {
        Promise.all([
            fetch('/api/admin/usuarios').then(r => r.json()),
            fetch('/api/admin/config/especies').then(r => r.json()),
            fetch('/api/admin/datos').then(r => r.json()),
            fetch('/api/admin/encuestas').then(r => r.json()),
            fetch('/api/admin/reflexiones').then(r => r.json())
        ]).then(([u, e, r, ec, ref]) => {
            usuarios = u; especiesConfig = e; resultados = r; encuestas = ec; reflexiones = ref;
            cambiarTab('usuarios');
        }).catch(e => console.error(e));
    });

    function mostrarMensaje(m, c) {
        let d = document.createElement('div');
        d.className = 'mensaje-flotante';
        d.textContent = m;
        d.style.background = c;
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 3000);
    }

    // FIX: usa data-tab para activar la pestaña correcta, sin depender del texto
    function cambiarTab(tab) {
        document.querySelectorAll('.tab').forEach(t => {
            t.classList.toggle('active', t.dataset.tab === tab);
        });

        if (tab === 'usuarios') mostrarUsuarios();
        else if (tab === 'especies') mostrarEspecies();
        else if (tab === 'estadisticas') mostrarEstadisticas();
        else if (tab === 'graficos') mostrarGraficos();
        else if (tab === 'analisis') mostrarAnalisisEstadistico();
        else if (tab === 'detalles') mostrarResultadosDetallados();
        else if (tab === 'estadisticas_estudiante') mostrarEstadisticasEstudiante();
        else if (tab === 'reflexiones') mostrarReflexiones();
    }

    function mostrarUsuarios() {
        let html = `<div class="stats-grid">
            <div class="stat-card"><div class="stat-number">${usuarios.length}</div><div class="stat-label">Total</div></div>
            <div class="stat-card"><div class="stat-number">${usuarios.filter(u => !u.grupo_asignado).length}</div><div class="stat-label">Pendientes</div></div>
        </div>
        <div class="table-container"><table><thead><tr><th>ID</th><th>Usuario</th><th>Correo</th><th>Sem.</th><th>Curso</th><th>Exp.</th><th>Hab.Esp</th><th>Grupo</th><th>Acciones</th></tr></thead><tbody id="tbodyUsuarios"></tbody></table></div>`;
        document.getElementById('tabContent').innerHTML = html;
        const tbody = document.getElementById('tbodyUsuarios');
        tbody.innerHTML = usuarios.map(u => {
            let badge = '', text = u.grupo_asignado || 'Pendiente';
            if (u.grupo_asignado === '2D') badge = 'badge-2d';
            else if (u.grupo_asignado === '2D_META') badge = 'badge-2d-meta';
            else if (u.grupo_asignado === '3D') badge = 'badge-3d';
            else if (u.grupo_asignado === '3D_META') badge = 'badge-3d-meta';
            let btns = !u.grupo_asignado
                ? `<div class="btn-group"><button class="btn-small btn-2d" onclick="asignarGrupo(${u.id},'2D')">2D</button><button class="btn-small btn-2d-meta" onclick="asignarGrupo(${u.id},'2D_META')">2D+M</button><button class="btn-small btn-3d" onclick="asignarGrupo(${u.id},'3D')">3D</button><button class="btn-small btn-3d-meta" onclick="asignarGrupo(${u.id},'3D_META')">3D+M</button><button class="btn-small btn-danger" onclick="eliminarUsuario(${u.id})">🗑️</button></div>`
                : `<button class="btn-small btn-danger" onclick="eliminarUsuario(${u.id})">🗑️</button>`;
            return `<tr><td>${u.id}</td><td><strong>${u.nombre_usuario}</strong></td><td>${u.correo}</td><td>${u.semestre || '-'}</td><td>${u.curso || '-'}</td><td>${u.experiencia_taxonomica || '-'}/5</td><td>${u.habilidad_espacial || '-'}/20</td><td><span class="badge ${badge}">${text}</span></td><td>${btns}</td></tr>`;
        }).join('');
    }

    async function asignarGrupo(id, g) {
        if (!confirm(`¿Asignar al grupo ${g}?`)) return;
        await fetch('/api/admin/asignar_grupo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ usuario_id: id, grupo: g }) });
        mostrarMensaje(`✅ Grupo ${g} asignado`, '#00D4FF');
        location.reload();
    }

    async function eliminarUsuario(id) {
        if (!confirm('¿Eliminar usuario? Se pierden TODOS sus datos.')) return;
        await fetch(`/api/admin/usuarios/${id}`, { method: 'DELETE' });
        mostrarMensaje('✅ Usuario eliminado', '#00D4FF');
        location.reload();
    }

    function mostrarEspecies() {
        document.getElementById('tabContent').innerHTML = `<div class="card"><div class="card-title">🔬 Selecciona especies activas</div><div id="especiesGrid" class="especies-grid"></div><div style="display:flex;gap:15px;margin-top:20px;"><button class="btn btn-primary" onclick="guardarEspecies()">💾 Guardar</button><button class="btn btn-secondary" onclick="seleccionarTodas()">✅ Todas</button><button class="btn btn-secondary" onclick="deseleccionarTodas()">❌ Ninguna</button></div></div>`;
        renderEspeciesConfig();
    }

    function toggleEspecie(id) {
        if (especiesConfig.activas.includes(id)) especiesConfig.activas = especiesConfig.activas.filter(i => i !== id);
        else especiesConfig.activas.push(id);
        renderEspeciesConfig();
    }

    function renderEspeciesConfig() {
        const grid = document.getElementById('especiesGrid');
        if (grid) grid.innerHTML = especiesConfig.todas.map(esp => {
            let act = especiesConfig.activas.includes(esp.id);
            return `<div class="especie-card ${act ? 'active' : ''}" onclick="toggleEspecie('${esp.id}')"><input type="checkbox" ${act ? 'checked' : ''} style="accent-color:#00D4FF;" onclick="event.stopPropagation();toggleEspecie('${esp.id}')"><div><strong>${esp.nombre}</strong><br><span style="color:#A0A0B0;">${esp.id}</span></div></div>`;
        }).join('');
    }

    function seleccionarTodas() { especiesConfig.activas = especiesConfig.todas.map(e => e.id); renderEspeciesConfig(); mostrarMensaje('✅ Todas seleccionadas', '#00D4FF'); }
    function deseleccionarTodas() { especiesConfig.activas = []; renderEspeciesConfig(); mostrarMensaje('❌ Ninguna seleccionada', '#FF375F'); }
    async function guardarEspecies() { await fetch('/api/admin/config/especies', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ activas: especiesConfig.activas }) }); mostrarMensaje('✅ Configuración guardada', '#00D4FF'); }

    // FIX: función cerrada correctamente — ya NO contiene a mostrarGraficos ni a las demás
    function mostrarEstadisticas() {
        const totalUsuarios = usuarios.length;
        const totalSesiones = [...new Set(resultados.map(r => r.sesion_id))].length;
        const aciertos = resultados.filter(r => r.acerto).length;
        const precision = resultados.length > 0 ? Math.round((aciertos / resultados.length) * 100) : 0;
        const tiempoProm = resultados.length > 0 ? Math.round(resultados.reduce((sum, r) => sum + (r.tiempo || 0), 0) / resultados.length) : 0;

        const grupos = ['2D', '2D_META', '3D', '3D_META'];
        const gruposNombres = ['2D', '2D+Meta', '3D', '3D+Meta'];

        const precisionPorGrupo = grupos.map(g => {
            const resGrupo = resultados.filter(r => r.grupo === g);
            const aciertosGrupo = resGrupo.filter(r => r.acerto).length;
            return resGrupo.length > 0 ? Math.round((aciertosGrupo / resGrupo.length) * 100) : 0;
        });

        const tiempoPorGrupo = grupos.map(g => {
            const resGrupo = resultados.filter(r => r.grupo === g);
            return resGrupo.length > 0 ? Math.round(resGrupo.reduce((sum, r) => sum + (r.tiempo || 0), 0) / resGrupo.length) : 0;
        });

        document.getElementById('tabContent').innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-number">${totalUsuarios}</div><div class="stat-label">Usuarios</div></div>
                <div class="stat-card"><div class="stat-number">${totalSesiones}</div><div class="stat-label">Sesiones</div></div>
                <div class="stat-card"><div class="stat-number">${precision}%</div><div class="stat-label">Precisión global</div></div>
                <div class="stat-card"><div class="stat-number">${tiempoProm}s</div><div class="stat-label">Tiempo promedio</div></div>
            </div>
            <div class="card">
                <div class="card-title">📊 Resultados por grupo</div>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Grupo</th><th>Precisión</th><th>Tiempo promedio</th></tr></thead>
                        <tbody>
                            ${gruposNombres.map((g, i) => `<tr><td><strong>${g}</strong></td><td>${precisionPorGrupo[i]}%</td><td>${tiempoPorGrupo[i]}s</td></tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    } // ← CIERRE CORRECTO de mostrarEstadisticas

    // FIX: ahora es una función global, accesible desde cambiarTab
    function mostrarGraficos() {
        const grupos = ['2D', '2D_META', '3D', '3D_META'];
        const gruposNombres = ['2D', '2D+Meta', '3D', '3D+Meta'];

        const precisionPorGrupo = grupos.map(g => {
            const resGrupo = resultados.filter(r => r.grupo === g);
            const aciertosGrupo = resGrupo.filter(r => r.acerto).length;
            return resGrupo.length > 0 ? Math.round((aciertosGrupo / resGrupo.length) * 100) : 0;
        });

        const tiempoPorGrupo = grupos.map(g => {
            const resGrupo = resultados.filter(r => r.grupo === g);
            return resGrupo.length > 0 ? Math.round(resGrupo.reduce((sum, r) => sum + (r.tiempo || 0), 0) / resGrupo.length) : 0;
        });

        const susPorGrupo = grupos.map(g => {
            const encuestasGrupo = encuestas.filter(e => e.grupo === g && e.tipo === 'SUS');
            if (encuestasGrupo.length === 0) return 0;
            return Math.round(encuestasGrupo.reduce((sum, e) => sum + (e.puntaje_total || 0), 0) / encuestasGrupo.length);
        });

        document.getElementById('tabContent').innerHTML = `
            <div class="charts-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(400px,1fr)); gap:25px;">
                <div class="chart-container" style="background:#1A1F36; border-radius:15px; padding:20px;">
                    <div class="card-title">📊 Precisión por grupo</div>
                    <canvas id="chartPrecision"></canvas>
                </div>
                <div class="chart-container" style="background:#1A1F36; border-radius:15px; padding:20px;">
                    <div class="card-title">⏱️ Tiempo promedio por grupo</div>
                    <canvas id="chartTiempo"></canvas>
                </div>
                <div class="chart-container" style="background:#1A1F36; border-radius:15px; padding:20px;">
                    <div class="card-title">📋 Puntaje SUS por grupo</div>
                    <canvas id="chartSUS"></canvas>
                </div>
            </div>
        `;

        setTimeout(() => {
            new Chart(document.getElementById('chartPrecision'), {
                type: 'bar',
                data: { labels: gruposNombres, datasets: [{ label: 'Precisión (%)', data: precisionPorGrupo, backgroundColor: ['#00D4FF', '#00D4FF80', '#7B61FF', '#7B61FF80'], borderRadius: 8 }] },
                options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
            });
            new Chart(document.getElementById('chartTiempo'), {
                type: 'bar',
                data: { labels: gruposNombres, datasets: [{ label: 'Tiempo (segundos)', data: tiempoPorGrupo, backgroundColor: ['#00D4FF', '#00D4FF80', '#7B61FF', '#7B61FF80'], borderRadius: 8 }] },
                options: { responsive: true }
            });
            new Chart(document.getElementById('chartSUS'), {
                type: 'bar',
                data: { labels: gruposNombres, datasets: [{ label: 'Puntaje SUS', data: susPorGrupo, backgroundColor: ['#00D4FF', '#00D4FF80', '#7B61FF', '#7B61FF80'], borderRadius: 8 }] },
                options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
            });
        }, 100);
    }

    function mostrarAnalisisEstadistico() {
    // Separar grupos
    const grupo2d = resultados.filter(r => r.grupo === '2D' || r.grupo === '2D_META');
    const grupo3d = resultados.filter(r => r.grupo === '3D' || r.grupo === '3D_META');
    
    // Si no hay datos
    if (resultados.length === 0) {
        document.getElementById('tabContent').innerHTML = `<div class="card"><div class="card-title">📊 Análisis Estadístico</div><p>No hay datos suficientes para el análisis.</p></div>`;
        return;
    }
    
    // Calcular precisión
    const aciertos2d = grupo2d.filter(r => r.acerto).length;
    const aciertos3d = grupo3d.filter(r => r.acerto).length;
    const precision2d = grupo2d.length > 0 ? (aciertos2d / grupo2d.length * 100).toFixed(1) : 0;
    const precision3d = grupo3d.length > 0 ? (aciertos3d / grupo3d.length * 100).toFixed(1) : 0;
    
    // Calcular tiempos promedio
    const tiempo2d = grupo2d.length > 0 ? (grupo2d.reduce((s,r) => s + (r.tiempo || 0), 0) / grupo2d.length).toFixed(1) : 0;
    const tiempo3d = grupo3d.length > 0 ? (grupo3d.reduce((s,r) => s + (r.tiempo || 0), 0) / grupo3d.length).toFixed(1) : 0;
    
    // Mejoras
    const mejoraPrecision = (precision3d - precision2d).toFixed(1);
    const mejoraTiempo = tiempo2d > 0 ? ((tiempo2d - tiempo3d) / tiempo2d * 100).toFixed(1) : 0;
    
    // Determinar significancia (simulada)
    const esSignificativo = mejoraPrecision > 5;
    
    document.getElementById('tabContent').innerHTML = `
        <div class="card">
            <div class="card-title">📊 Análisis Estadístico - Comparación 2D vs 3D</div>
            
            <div class="table-container">
                <table style="width:100%">
                    <thead><tr><th>Indicador</th><th>Grupo 2D (n=${grupo2d.length})</th><th>Grupo 3D (n=${grupo3d.length})</th><th>Diferencia</th></tr></thead>
                    <tbody>
                        <tr style="background:#1A1F36;"><td><strong>✅ Precisión</strong></td><td>${precision2d}%</td><td>${precision3d}%</td><td style="color:${mejoraPrecision >= 0 ? '#00D4FF' : '#FF375F'}">${mejoraPrecision >= 0 ? '+' : ''}${mejoraPrecision}%</td></tr>
                        <tr><td><strong>⏱️ Tiempo promedio</strong></td><td>${tiempo2d}s</td><td>${tiempo3d}s</td><td style="color:${mejoraTiempo >= 0 ? '#00D4FF' : '#FF375F'}">${mejoraTiempo >= 0 ? '-' : '+'}${Math.abs(mejoraTiempo)}%</td></tr>
                    </tbody>
                </table>
            </div>
            
            <div style="margin-top:20px; padding:15px; background:#1A1F36; border-radius:10px;">
                <h3 style="color:#00D4FF;">📋 Conclusiones</h3>
                <p>📊 <strong>Precisión:</strong> El grupo 3D obtuvo un ${precision3d}% de aciertos, frente al ${precision2d}% del grupo 2D. Una mejora de <strong>${Math.abs(mejoraPrecision)} puntos porcentuales</strong>.</p>
                <p>⏱️ <strong>Eficiencia:</strong> El grupo 3D completó las identificaciones un ${mejoraTiempo}% más rápido que el grupo 2D.</p>
                <p>${esSignificativo ? '✅ La diferencia es estadísticamente relevante a favor del grupo 3D.' : '⚠️ Las diferencias observadas requieren una muestra más grande para confirmar significancia estadística.'}</p>
            </div>
        </div>
    `;
}

    function mostrarResultadosDetallados() {
        let html = `<div class="card"><div class="card-title">🔬 Resultados Detallados</div><div class="table-container"><table><thead><tr><th>Usuario</th><th>Grupo</th><th>Espécimen</th><th>Correcta</th><th>Seleccionada</th><th>Resultado</th><th>Tiempo</th></tr></thead><tbody>`;
        resultados.forEach(r => {
            html += `<tr><td>${r.usuario}</td><td>${r.grupo}</td><td>${r.especimen || 'N/A'}</td><td>${r.correcta || 'N/A'}</td><td>${r.seleccionada || 'N/A'}</td><td style="color:${r.acerto ? '#00D4FF' : '#FF375F'}">${r.acerto ? '✅ Correcto' : '❌ Incorrecto'}</td><td>${(r.tiempo || 0).toFixed(1)}s</td></tr>`;
        });
        html += `</tbody></table></div></div>`;
        document.getElementById('tabContent').innerHTML = html;
    }

    function mostrarEstadisticasEstudiante() {
        let mapa = new Map();
        resultados.forEach(r => {
            if (!mapa.has(r.usuario)) mapa.set(r.usuario, { total: 0, aciertos: 0 });
            let s = mapa.get(r.usuario);
            s.total++;
            if (r.acerto) s.aciertos++;
        });
        let html = `<div class="card"><div class="card-title">📋 Estadísticas por Estudiante</div><div class="table-container"><table><thead><tr><th>Estudiante</th><th>Total</th><th>Aciertos</th><th>Precisión</th></tr></thead><tbody>`;
        mapa.forEach((s, u) => {
            let p = s.total ? Math.round((s.aciertos / s.total) * 100) : 0;
            html += `<tr><td><strong>${u}</strong></td><td>${s.total}</td><td>${s.aciertos}</td><td>${p}%</td></tr>`;
        });
        html += `</tbody></table></div></div>`;
        document.getElementById('tabContent').innerHTML = html;
    }

    function mostrarReflexiones() {
        let html = `<div class="card"><div class="card-title">🧠 Reflexiones Metacognitivas</div><div class="table-container"><table><thead><tr><th>Usuario</th><th>Grupo</th><th>Momento</th><th>Respuesta</th></tr></thead><tbody>`;
        reflexiones.forEach(r => { html += `<tr><td>${r.usuario}</td><td>${r.grupo}</td><td>${r.momento || '-'}</td><td>${(r.respuesta_raw || '').substring(0, 100)}...</td></tr>`; });
        html += `</tbody></table></div><div style="margin-top:15px;"><button class="btn btn-secondary" onclick="exportarReflexionesCSV()">📥 Exportar Reflexiones CSV</button></div></div>`;
        document.getElementById('tabContent').innerHTML = html;
    }

    function exportarReflexionesCSV() {
        let csv = "Usuario,Grupo,Momento,Pregunta,Respuesta\n";
        reflexiones.forEach(r => { csv += `"${r.usuario}","${r.grupo}","${r.momento}","${(r.pregunta || '').replace(/"/g, '""')}","${(r.respuesta_raw || '').replace(/"/g, '""')}"\n`; });
        let blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `reflexiones_${new Date().toISOString().split('T')[0]}.csv`; a.click(); URL.revokeObjectURL(a.href);
        mostrarMensaje('✅ Reflexiones exportadas', '#00D4FF');
    }

    async function obtenerTodos() { return { usuarios, resultados, encuestas, reflexiones }; }

    function exportarExcel() {
        (async () => {
            let { usuarios, resultados, encuestas, reflexiones } = await obtenerTodos();
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(usuarios.map(u => ({ ID: u.id, Usuario: u.nombre_usuario, Correo: u.correo, Grupo: u.grupo_asignado || 'Sin asignar' }))), 'Usuarios');
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resultados.map(r => ({ Usuario: r.usuario, Grupo: r.grupo, Especimen: r.especimen || '', Resultado: r.acerto ? 'Correcto' : 'Incorrecto', Tiempo: r.tiempo || 0 }))), 'Resultados');
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(encuestas.map(e => ({ Usuario: e.usuario || '', Grupo: e.grupo || '', Tipo: e.tipo, Puntaje: e.puntaje_total || '' }))), 'Encuestas');
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(reflexiones.map(r => ({ Usuario: r.usuario, Grupo: r.grupo, Momento: r.momento, Respuesta: r.respuesta_raw }))), 'Reflexiones');
            XLSX.writeFile(wb, `datos_${new Date().toISOString().split('T')[0]}.xlsx`);
            mostrarMensaje('✅ Excel exportado', '#00D4FF');
        })();
    }

    // FIX: exportarCSV ahora genera CSV real en lugar de llamar a exportarExcel
    function exportarCSV() {
        (async () => {
            let { resultados } = await obtenerTodos();
            let csv = "Usuario,Grupo,Especimen,Correcta,Seleccionada,Resultado,Tiempo\n";
            resultados.forEach(r => {
                csv += `"${r.usuario}","${r.grupo}","${r.especimen || ''}","${r.correcta || ''}","${r.seleccionada || ''}","${r.acerto ? 'Correcto' : 'Incorrecto'}","${(r.tiempo || 0).toFixed(1)}"\n`;
            });
            let blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `datos_${new Date().toISOString().split('T')[0]}.csv`; a.click(); URL.revokeObjectURL(a.href);
            mostrarMensaje('✅ CSV exportado', '#00D4FF');
        })();
    }

    function exportarJSON() {
        obtenerTodos().then(d => {
            let b = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
            let a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `datos_${new Date().toISOString().split('T')[0]}.json`; a.click();
            mostrarMensaje('✅ JSON exportado', '#00D4FF');
        });
    }

    function exportarReporteHTML() {
        (async () => {
            let { usuarios, resultados } = await obtenerTodos();
            let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Reporte</title><style>body{font-family:Arial;margin:40px;background:#0A0E17;color:#E0E0E0;}table{border-collapse:collapse;width:100%;}th,td{border:1px solid #444;padding:8px;}th{background:#1A1F36;color:#00D4FF;}</style></head><body><h1>Reporte de Resultados</h1><p>Generado: ${new Date().toLocaleString()}</p><h2>Usuarios</h2><table><thead><tr><th>ID</th><th>Usuario</th><th>Correo</th><th>Grupo</th></tr></thead><tbody>${usuarios.map(u => `<tr><td>${u.id}</td><td>${u.nombre_usuario}</td><td>${u.correo}</td><td>${u.grupo_asignado || ''}</td></tr>`).join('')}</tbody></table><h2>Resultados</h2><table><thead><tr><th>Usuario</th><th>Resultado</th><th>Tiempo</th></tr></thead><tbody>${resultados.map(r => `<tr><td>${r.usuario}</td><td>${r.acerto ? 'Correcto' : 'Incorrecto'}</td><td>${r.tiempo}s</td></tr>`).join('')}</tbody></table></body></html>`;
            let b = new Blob([html], { type: 'text/html' }); let a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `reporte_${new Date().toISOString().split('T')[0]}.html`; a.click();
            mostrarMensaje('✅ Reporte generado', '#00D4FF');
        })();
    }
</script>
</body>
</html>
