<!DOCTYPE html>
<html lang="es">
<head>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Clave Linepithema</title>
    <script src="/static/vendor/chart.umd.js"></script>
    <script>window.Chart || document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js"><\/script>')</script>
    <script src="/static/vendor/xlsx.full.min.js"></script>
    <script>window.XLSX || document.write('<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"><\/script>')</script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0A0E17;color:#E0E0E0;font-family:'Segoe UI',sans-serif;padding:20px;}
        .container{max-width:1400px;margin:0 auto;}
        h1{background:linear-gradient(45deg,#00D4FF,#7B61FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:1.8rem;}
        .subtitle{color:#A0A0B0;margin-bottom:25px;border-bottom:1px solid #00D4FF30;padding-bottom:10px;font-size:0.9rem;}
        .tabs{display:flex;gap:8px;margin-bottom:25px;flex-wrap:wrap;}
        .tab{padding:10px 20px;background:#1A1F36;border:1px solid #00D4FF40;border-radius:8px;cursor:pointer;font-weight:600;font-size:0.9rem;transition:all 0.2s;}
        .tab:hover{border-color:#00D4FF80;}
        .tab.active{background:linear-gradient(45deg,#00D4FF20,#7B61FF20);border-color:#00D4FF;color:#00D4FF;}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:25px;}
        .stat-card{background:#121826;border:1px solid #00D4FF40;border-radius:15px;padding:20px;text-align:center;}
        .stat-number{font-size:2rem;font-weight:bold;color:#00D4FF;}
        .stat-label{color:#A0A0B0;font-size:0.85rem;margin-top:6px;}
        .card{background:#121826;border:1px solid #00D4FF40;border-radius:15px;padding:25px;margin-bottom:25px;}
        .card-title{color:#00D4FF;border-bottom:1px solid #00D4FF30;padding-bottom:10px;margin-bottom:20px;font-weight:bold;}
        .table-wrap{overflow-x:auto;}
        table{width:100%;border-collapse:collapse;}
        th{text-align:left;padding:12px;background:#1A1F36;color:#00D4FF;font-size:0.85rem;}
        td{padding:10px 12px;border-bottom:1px solid #1A1F36;font-size:0.85rem;}
        .badge{padding:3px 8px;border-radius:12px;font-size:0.78rem;}
        .badge-2d{background:#00D4FF20;color:#00D4FF;}
        .badge-2d-meta{background:#00D4FF40;color:#00D4FF;}
        .badge-3d{background:#7B61FF20;color:#7B61FF;}
        .badge-3d-meta{background:#7B61FF40;color:#7B61FF;}
        .badge-sin{background:#FFAA0020;color:#FFAA00;}
        .btn-group{display:flex;gap:4px;flex-wrap:wrap;}
        .btn-sm{padding:5px 10px;font-size:0.78rem;border:none;border-radius:5px;cursor:pointer;font-weight:600;}
        .btn-2d{background:#00D4FF;color:#0A0E17;}
        .btn-2d-meta{background:#00D4FF80;color:#0A0E17;}
        .btn-3d{background:#7B61FF;color:white;}
        .btn-3d-meta{background:#7B61FF80;color:white;}
        .btn-danger{background:#FF375F;color:white;}
        .toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
        .btn{padding:10px 20px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.9rem;transition:all 0.2s;}
        .btn:hover{transform:translateY(-2px);}
        .btn-primary{background:linear-gradient(45deg,#00D4FF,#7B61FF);color:white;}
        .btn-secondary{background:#1A1F36;border:1px solid #00D4FF40;color:#00D4FF;}
        .btn-success{background:#00D4FF20;border:1px solid #00D4FF40;color:#00D4FF;}
        .search-input{padding:10px 15px;background:#1A1F36;border:1px solid #00D4FF40;border-radius:8px;color:#E0E0E0;font-size:0.9rem;width:250px;max-width:100%;flex:1 1 200px;}
        .search-input:focus{outline:none;border-color:#00D4FF;}
        .mensaje-flotante{position:fixed;bottom:20px;right:20px;background:#00D4FF;color:#0A0E17;padding:12px 20px;border-radius:8px;font-weight:bold;z-index:1000;animation:fadeOut 3s forwards;}
        @keyframes fadeOut{0%{opacity:1;}70%{opacity:1;}100%{opacity:0;}}
        .especies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px;}
        .especie-card{background:#1A1F36;border:2px solid #1A1F36;border-radius:10px;padding:15px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all 0.2s;}
        .especie-card:hover{border-color:#00D4FF80;}
        .especie-card.active{border-color:#00D4FF;background:linear-gradient(135deg,#00D4FF10,#7B61FF10);}
        @media(max-width:800px){.charts-grid{grid-template-columns:1fr;}}
        .table-wrap table{min-width:600px;}
        @media(max-width:480px){
            body{padding:10px;}
            h1{font-size:1.4rem;}
            .card,.stat-card{padding:15px;}
            .tab{padding:8px 12px;font-size:0.8rem;}
            th,td{padding:8px;font-size:0.75rem;}
            .search-input{width:100%;}
            .toolbar,.btn-group{gap:6px;}
            .btn{padding:8px 14px;font-size:0.85rem;}
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 Panel de Administración</h1>
    <div class="subtitle">Gestión de participantes y análisis de resultados — Clave Linepithema</div>

<div id="tarjetaSesion" style="background:#121826;border:2px solid #00D4FF40;border-radius:14px;padding:16px 18px;margin:0 0 16px;color:#E0E0E0;">Cargando la sesión de aplicación…</div>
<div id="tarjetaCupos" style="background:#121826;border:1px solid #00D4FF30;border-radius:14px;padding:12px 18px;margin:-6px 0 16px;color:#E0E0E0;font-size:0.9rem;"></div>

    <div class="tabs">
        <div class="tab active" data-tab="usuarios"    onclick="cambiarTab('usuarios')">👥 Usuarios</div>
<div class="tab"        data-tab="monitor"     onclick="cambiarTab('monitor')">📡 Monitor</div>
        <div class="tab"        data-tab="especies"    onclick="cambiarTab('especies')">🔬 Especies</div>
        <div class="tab"        data-tab="estadisticas" onclick="cambiarTab('estadisticas')">📊 Estadísticas</div>
        <div class="tab"        data-tab="graficos"    onclick="cambiarTab('graficos')">📈 Gráficos</div>
        <div class="tab"        data-tab="analisis"    onclick="cambiarTab('analisis')">📉 Análisis</div>
        <div class="tab"        data-tab="detalles"    onclick="cambiarTab('detalles')">🔍 Resultados</div>
        <div class="tab"        data-tab="reflexiones" onclick="cambiarTab('reflexiones')">🧠 Reflexiones</div>
        <div class="tab"        data-tab="pines" onclick="cambiarTab('pines')">📍 Pines</div>
        <div class="tab"        data-tab="zoomcaracteres" onclick="cambiarTab('zoomcaracteres')">🔬 Zoom Caracteres</div>
    </div>

    <div class="toolbar">
        <button class="btn btn-primary" onclick="cargarDatosPanel(true)" title="Vuelve a pedir al servidor TODOS los datos (el panel los descarga una sola vez al abrirse)">🔄 Actualizar datos</button>
<span id="etiquetaDatos" style="color:#A0A0B0;font-size:0.8rem;align-self:center;"></span>
<button class="btn btn-primary" onclick="exportarExcel()" title="Excel con TODAS las tablas, siempre con los datos de este momento (anónimo)">📊 Excel completo</button>
<button class="btn btn-primary" onclick="descargarPaquete(false)" title="ZIP con las tablas en CSV, el diccionario de variables y un LEEME (anónimo)">📦 Paquete de análisis (ZIP)</button>
<button class="btn btn-secondary" onclick="descargarPaquete(true)" title="Igual, pero agrega identidades.csv con nombres y correos">🔐 Paquete con nombres</button>
<button class="btn btn-secondary" onclick="exportarJSON()" title="Todas las tablas en un JSON">📥 JSON completo</button>
<button class="btn btn-secondary" onclick="exportarCSVServidor()" title="El CSV anterior: una fila por espécimen">📥 CSV por espécimen</button>
        <button class="btn btn-secondary" onclick="window.location.href='/estadisticas'">📊 Estadísticas avanzadas</button>
        <button class="btn btn-secondary" onclick="window.open('/prueba-niveles-ayuda', '_blank')">🧪 Probar la ayuda «¿Dónde mirar?»</button>
        <button class="btn btn-secondary" onclick="descargarCopiaConfig()" title="Descarga las especies activas, los pines y los encuadres de zoom">💾 Copia de configuración</button>
        <button class="btn btn-secondary" onclick="document.getElementById('archivoCopiaConfig').click()" title="Restaura la configuración desde un archivo descargado antes">♻️ Restaurar configuración</button>
        <input type="file" id="archivoCopiaConfig" accept=".json,application/json" style="display:none" onchange="restaurarCopiaConfig(this)">
        <button class="btn btn-primary" onclick="descargarCopiaCompleta()" title="Descarga TODO: cuentas, resultados, pasos, reflexiones, encuestas y configuración">🗄️ Copia COMPLETA de la base</button>
        <button class="btn btn-secondary" onclick="document.getElementById('archivoCopiaCompleta').click()" title="Solo en una base nueva y vacía (por ejemplo, tras pasar a Neon)">📥 Restaurar copia completa</button>
        <input type="file" id="archivoCopiaCompleta" accept=".json,application/json" style="display:none" onchange="restaurarCopiaCompleta(this)">
        <button class="btn btn-secondary" onclick="mostrarPsicometriaRotacion(false)" title="Fiabilidad (KR-20), dificultad y discriminación de la prueba de rotación mental con los datos reales">🧩 Fiabilidad rotación mental</button>
        <button class="btn btn-secondary" onclick="mostrarBalanceGrupos()" title="Cuántos estudiantes hay por semestre y grupo, y el interruptor de la asignación automática">⚖️ Balance de grupos</button>
        <button class="btn btn-danger"    onclick="cerrarSesionAdmin()" style="background:#FF375F20;border:1px solid #FF375F40;color:#FF375F;">🔓 Cerrar sesión</button>
    </div>

    <div id="tabContent"></div>
</div>

<script>
    let usuarios = [], especiesConfig = { todas:[], activas:[] }, resultados = [], encuestas = [], reflexiones = [], pasos = [];

    // ===== Carga de datos del panel: una función que se puede repetir (botón «Actualizar datos») =====
// Antes los datos se descargaban UNA sola vez al abrir el panel y el Excel usaba esa copia: lo que hacían los participantes después no salía.
let datosCargadosEn = null;
async function pedirJSON(url) {
    const r = await fetch(url);
    if (r.status === 401) { window.location.href = '/admin'; throw new Error('sesión de administrador vencida'); }
    if (!r.ok) throw new Error(url + ' → HTTP ' + r.status);
    return r.json();
}
function actualizarEtiquetaDatos() {
    const el = document.getElementById('etiquetaDatos'); if (!el || !datosCargadosEn) return;
    const min = Math.round((Date.now() - datosCargadosEn.getTime()) / 60000);
    el.textContent = `Datos de las ${datosCargadosEn.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })}${min >= 1 ? ' (hace ' + min + ' min)' : ''} · ${usuarios.length} usuarios · ${resultados.length} resultados`;
    el.style.color = min >= 10 ? '#FFB020' : '#A0A0B0';
}
async function cargarDatosPanel(refrescando) {
    try {
        const [u, e, r, ec, ref, ps] = await Promise.all([pedirJSON('/api/admin/usuarios'), pedirJSON('/api/admin/config/especies'), pedirJSON('/api/admin/datos'),
                                                           pedirJSON('/api/admin/encuestas'), pedirJSON('/api/admin/reflexiones'), pedirJSON('/api/admin/pasos')]);
        usuarios = u; especiesConfig = e; resultados = r; encuestas = ec; reflexiones = ref; pasos = ps;
        datosCargadosEn = new Date(); actualizarEtiquetaDatos();
        const activa = (document.querySelector('.tab.active') || {}).dataset;
        const tab = refrescando && activa ? activa.tab : 'usuarios';
        if (!(refrescando && ['pines', 'zoomcaracteres'].includes(tab))) cambiarTab(tab);      // las pestañas de calibración no se redibujan: se perderían cambios sin guardar
        if (refrescando) { mostrarMensaje(`🔄 Datos actualizados: ${usuarios.length} usuarios, ${resultados.length} resultados`); cargarSesionAplicacion && cargarSesionAplicacion(); }
    } catch (err) {
        if (refrescando) { mostrarMensaje('❌ No se pudieron actualizar los datos: ' + err.message, '#FF375F'); return; }
        document.getElementById('tabContent').innerHTML = '<div style="padding:40px;text-align:center;color:#FF375F;">❌ Error cargando datos (' + (err.message || err) + '). Verifica que estás autenticado y vuelve a intentarlo.</div>';
    }
}
document.addEventListener('DOMContentLoaded', () => { cargarDatosPanel(false); setInterval(actualizarEtiquetaDatos, 30000); });

    function mostrarMensaje(m, c='#00D4FF') {
        const d = document.createElement('div');
        d.className = 'mensaje-flotante';
        d.textContent = m;
        d.style.background = c;
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 3500);
    }

    // ===== MONITOR DE SESIÓN EN VIVO: en qué punto va cada estudiante y quién lleva rato sin avanzar =====
    const ETQ_ESTADO = { en_clave: '🔬 En la clave', encuestas: '📝 Encuestas', comentario: '💬 Comentario final', sin_iniciar: '⏳ Sin iniciar', sin_grupo: '🚫 Sin grupo', terminado: '✅ Terminó' };
    const COLOR_ESTADO = { en_clave: '#00D4FF', encuestas: '#B8A6FF', comentario: '#B8A6FF', sin_iniciar: '#FFB020', sin_grupo: '#8A93A6', terminado: '#30D158' };
    let INTERVALO_MONITOR = 15000, monitorTimer = null, opcionesMonitor = { horas: 6, auto: true };
    function detenerMonitor() { if (monitorTimer) { clearInterval(monitorTimer); monitorTimer = null; } }
    async function mostrarMonitor() {
        detenerMonitor();
        document.getElementById('tabContent').innerHTML = `<div class="card"><div class="card-title">📡 Monitor de sesión</div>
            <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">
                <label style="font-size:0.85rem;">Actividad de las últimas <select id="monitorHoras" onchange="opcionesMonitor.horas = +this.value; cargarMonitor();" style="background:#1A1F36;color:#E0E0E0;border:1px solid #00D4FF40;border-radius:6px;padding:4px;">${[3, 6, 12, 24].map(n => `<option value="${n}" ${opcionesMonitor.horas === n ? 'selected' : ''}>${n}</option>`).join('')}</select> h</label>
                <label style="font-size:0.85rem;"><input type="checkbox" id="monitorAuto" ${opcionesMonitor.auto ? 'checked' : ''} onchange="opcionesMonitor.auto = this.checked; mostrarMonitorTimer();"> Actualizar solo cada ${Math.round(INTERVALO_MONITOR / 1000)} s</label>
                <button class="btn btn-secondary" onclick="cargarMonitor()">🔄 Actualizar ahora</button><span id="monitorHora" style="color:#A0A0B0;font-size:0.8rem;"></span></div>
            <div id="monitorResumen" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;"></div><div id="monitorTabla" style="overflow-x:auto;">Cargando…</div>
            <div style="color:#6B7280;font-size:0.78rem;margin-top:10px;line-height:1.5;">Incluye a quienes entraron con el código vigente y a quienes tuvieron actividad en ese período. ⚠️ amarillo: lleva 4 min sin avanzar (15 si aún no inicia); rojo: 8 min (o 15). Pasadas 90 min sin actividad se asume que la persona se fue y deja de marcarse. Un paso suele tardar ~1 min; si alguien lleva más, probablemente se trabó o no entendió: acércate o usa 🔁 «Anular y habilitar».</div></div>`;
        await cargarMonitor(); mostrarMonitorTimer();
    }
    function mostrarMonitorTimer() { detenerMonitor(); if (opcionesMonitor.auto) monitorTimer = setInterval(() => { if ((document.querySelector('.tab.active') || {}).dataset && document.querySelector('.tab.active').dataset.tab === 'monitor') cargarMonitor(); else detenerMonitor(); }, INTERVALO_MONITOR); }
    async function cargarMonitor() {
        const caja = document.getElementById('monitorTabla'); if (!caja) return;
        let d; try { const r = await fetch('/api/admin/monitor_sesion?horas=' + opcionesMonitor.horas); if (r.status === 401) { window.location.href = '/admin'; return; } d = await r.json(); if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status); }
        catch (e) { const c = document.getElementById('monitorHora'); if (c) c.textContent = '⚠️ no se pudo actualizar (' + e.message + ')'; return; }
        const chip = (txt, n, color) => `<div style="background:#1A1F36;border:1px solid ${color}60;border-radius:10px;padding:8px 14px;min-width:92px;text-align:center;"><div style="font-size:1.4rem;font-weight:800;color:${color};">${n}</div><div style="font-size:0.72rem;color:#A0A0B0;">${txt}</div></div>`;
        const r = d.resumen;
        document.getElementById('monitorResumen').innerHTML = chip('En la clave', r.en_clave, '#00D4FF') + chip('Encuestas', r.encuestas, '#B8A6FF') + chip('Falta comentario', r.comentario, '#B8A6FF') + chip('Sin iniciar', r.sin_iniciar, '#FFB020') + chip('Terminaron', r.terminado, '#30D158') + chip('Sin grupo', r.sin_grupo, '#8A93A6') + chip('⚠️ Con alerta', r.alertas, r.alertas ? '#FF375F' : '#6B7280');
        const fila = f => { const fondo = f.alerta === 2 ? 'rgba(255,55,95,0.16)' : (f.alerta === 1 ? 'rgba(255,176,32,0.12)' : 'transparent');
            return `<tr style="background:${fondo};border-top:1px solid #00D4FF15;"><td style="padding:8px 6px;"><strong>${escapeHtmlAdmin(f.nombre)}</strong>${f.intentos_anulados ? ` <span title="intentos anulados" style="color:#A0A0B0;">↺${f.intentos_anulados}</span>` : ''}</td><td style="text-align:center;">${f.semestre === null || f.semestre === undefined ? '—' : f.semestre + '°'}</td><td style="text-align:center;">${escapeHtmlAdmin(NOMBRE_GRUPO[f.grupo] || '—')}</td>
                <td style="color:${COLOR_ESTADO[f.estado]};white-space:nowrap;">${ETQ_ESTADO[f.estado]}</td><td style="font-size:0.85rem;">${escapeHtmlAdmin(f.detalle)}</td>
                <td style="white-space:nowrap;font-size:0.85rem;">${escapeHtmlAdmin(f.ultima_actividad)}${f.minutos_inactivo !== null && f.estado !== 'terminado' ? ` <span style="color:${f.alerta === 2 ? '#FF375F' : (f.alerta === 1 ? '#FFB020' : '#A0A0B0')};font-weight:${f.alerta ? 700 : 400};">(hace ${f.minutos_inactivo < 1 ? '<1 min' : (f.minutos_inactivo >= 90 ? (f.minutos_inactivo >= 2880 ? Math.round(f.minutos_inactivo / 1440) + ' d' : Math.round(f.minutos_inactivo / 60) + ' h') : Math.round(f.minutos_inactivo) + ' min')})</span>` : ''}</td>
                <td style="text-align:center;white-space:nowrap;">${f.alerta ? '⚠️ ' : ''}${f.grupo ? `<button class="btn-sm" style="background:#30D158;color:#06210F;" onclick="abrirAnularIntento(${f.id})" title="Anular el intento y habilitar uno nuevo (no borra datos)">🔁</button>` : ''}</td></tr>`; };
        caja.innerHTML = d.filas.length ? `<table style="width:100%;border-collapse:collapse;font-size:0.9rem;"><thead><tr style="text-align:left;color:#00D4FF;"><th style="padding:8px 6px;">Estudiante</th><th>Sem.</th><th>Grupo</th><th>Estado</th><th>Detalle</th><th>Última actividad</th><th></th></tr></thead><tbody>${d.filas.map(fila).join('')}</tbody></table>`
            : '<div style="color:#A0A0B0;padding:16px;">Todavía no hay estudiantes con actividad en este período. Cuando entren con el código, aparecerán aquí.</div>';
        const c = document.getElementById('monitorHora'); if (c) c.textContent = 'Actualizado a las ' + d.generado.slice(11, 19);
    }

    // ===== Cupos por grupo: cuántos estudiantes cuentan en cada grupo y cuántos faltan para el objetivo =====
    const NOMBRE_GRUPO = { '2D': '2D', '2D_META': '2D+M', '3D': '3D', '3D_META': '3D+M' };
    async function cargarCupos() {
        const caja = document.getElementById('tarjetaCupos'); if (!caja) return;
        let d; try { const r = await fetch('/api/admin/objetivo_grupo'); if (!r.ok) throw new Error('HTTP ' + r.status); d = await r.json(); } catch (e) { caja.innerHTML = ''; return; }
        const gs = Object.keys(NOMBRE_GRUPO), obj = d.objetivo;
        const faltan = obj > 0 ? gs.reduce((s, g) => s + Math.max(0, obj - d.efectivos[g]), 0) : 0;
        const barra = g => { const n = d.efectivos[g], pct = obj > 0 ? Math.min(100, Math.round(100 * n / obj)) : 0, lleno = obj > 0 && n >= obj, entra = d.candidatos.includes(g) && obj > 0 && !lleno;
            return `<div style="flex:1;min-width:130px;"><div style="display:flex;justify-content:space-between;font-size:0.82rem;"><strong>${NOMBRE_GRUPO[g]}</strong><span style="color:${lleno ? '#30D158' : '#E0E0E0'};">${n}${obj > 0 ? ' / ' + obj : ''}${lleno ? ' ✓' : ''}</span></div>
                <div style="height:8px;background:#1A1F36;border-radius:6px;overflow:hidden;margin:4px 0;"><div style="width:${pct}%;height:100%;background:${lleno ? '#30D158' : '#00D4FF'};"></div></div>
                <div style="font-size:0.72rem;color:${entra ? '#00D4FF' : '#6B7280'};">${obj > 0 ? (lleno ? 'completo' : (entra ? '← reciben ahora' : 'esperando')) : ''}</div></div>`; };
        caja.innerHTML = `<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;">
            <div style="min-width:170px;"><div style="color:#00D4FF;font-weight:700;">🎯 Cupos por grupo</div><div style="color:#A0A0B0;font-size:0.78rem;line-height:1.4;">${obj > 0 ? (faltan > 0 ? `Faltan <strong style="color:#E0E0E0;">${faltan}</strong> estudiantes para completar los 4 grupos.` : 'Todos los grupos están completos: se reparte parejo.') : 'Sin objetivo: se reparte parejo entre los 4 grupos.'}</div></div>
            ${gs.map(barra).join('')}</div>
            <div style="color:#6B7280;font-size:0.75rem;margin-top:8px;">Cuentan quienes ya iniciaron el ejercicio y los registrados en las últimas ${d.horas_pendiente} h. Los nuevos estudiantes van a los grupos más atrasados (entre ellos, equilibrando por semestre). El objetivo se cambia en «⚖️ Balance de grupos».</div>`;
    }
    document.addEventListener('DOMContentLoaded', () => cargarCupos());

    // ===== Sesión de aplicación y código de participación =====
    // Cada vez que entras a este panel se abre una sesión nueva con un código nuevo. Solo quien escribe el código entra al estudio y recibe grupo.
    let sesionAplicacion = null;

        const caja = document.getElementById('tarjetaSesion'); if (!caja) return;

            const res = await fetch('/api/admin/sesion_aplicacion'); if (!res.ok) throw new Error('HTTP ' + res.status);
            sesionAplicacion = await res.json();
        } catch (e) { caja.innerHTML = '⚠️ No se pudo cargar la sesión de aplicación.'; return; }
        const a = sesionAplicacion.actual, hora = t => new Date(t).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }), fecha = t => new Date(t).toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit' });
        if (!a) {
            caja.innerHTML = `<div style="font-weight:700;color:#00D4FF;margin-bottom:6px;">🔑 Sesión de aplicación</div><div style="color:#A0A0B0;margin-bottom:10px;">Todavía no hay un código. Se genera solo cada vez que entras a este panel, o puedes crearlo ahora.</div><button class="btn btn-primary" onclick="nuevaSesionAplicacion()">🔄 Generar código</button>`; return;
        }
        const est = { abierta: ['#30D158', '✅ ABIERTA'], reemplazada: ['#FFB020', '⚠️ REEMPLAZADA'], cerrada: ['#FF375F', '⛔ CERRADA'], vencida: ['#FF375F', '⌛ VENCIDA'] }[a.estado];
        const vale = a.estado === 'abierta';
        caja.innerHTML = `<div style="display:flex;gap:22px;flex-wrap:wrap;align-items:center;">
            <div><div style="color:#A0A0B0;font-size:0.8rem;">Código para tus estudiantes · sesión #${a.n}</div>
            <div id="codigoGrande" style="font-size:2.6rem;font-weight:800;letter-spacing:6px;color:${vale ? '#00D4FF' : '#6B7280'};font-family:monospace;${vale ? '' : 'text-decoration:line-through;'}">${a.codigo}</div></div>
            <div style="flex:1;min-width:260px;line-height:1.6;"><strong style="color:${est[0]};">${est[1]}</strong> · abierta a las ${hora(a.inicio)} · ${vale ? 'vence a las ' + hora(a.vence) + (fecha(a.vence) !== fecha(a.inicio) ? ' (' + fecha(a.vence) + ')' : '') : ''}<br>
            Participantes que entraron con este código: <strong>${a.participantes}</strong></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="copiarCodigoSesion()">📋 Copiar</button>
                <button class="btn btn-secondary" onclick="nuevaSesionAplicacion()" title="Genera otro código; el anterior sigue valiendo ${sesionAplicacion.gracia_min} minutos">🔄 Nuevo código</button>
                ${vale ? '<button class="btn btn-secondary" onclick="cerrarSesionAplicacion()" title="Deja de aceptar el código de inmediato">⛔ Cerrar sesión</button>' : ''}
            </div></div>
            <div style="color:#A0A0B0;font-size:0.8rem;margin-top:10px;line-height:1.5;">Dicta o escribe este código en clase. El código <strong>cambia cada vez que entras a este panel</strong> (el anterior sigue valiendo ${sesionAplicacion.gracia_min} min por si entras de nuevo en plena sesión) y vence solo a las ${sesionAplicacion.vigencia_horas} h. Quien no lo escriba se puede registrar, pero queda fuera del estudio.
            ${sesionAplicacion.historial.length ? '<br>Sesiones anteriores: ' + sesionAplicacion.historial.slice(0, 4).map(h => `#${h.n} (${fecha(h.inicio)}, ${h.participantes} participantes)`).join(' · ') : ''}</div>`;
    }
    async function copiarCodigoSesion() {
        const c = sesionAplicacion && sesionAplicacion.actual && sesionAplicacion.actual.codigo; if (!c) return;
        try { await navigator.clipboard.writeText(c); mostrarMensaje('📋 Código copiado: ' + c); } catch (e) { mostrarMensaje('Código: ' + c); }
    }
    async function nuevaSesionAplicacion() {
        const res = await fetch('/api/admin/sesion_aplicacion/nueva', { method: 'POST' });

    async function cerrarSesionAplicacion() {
        if (!confirm('¿Cerrar la sesión de aplicación? El código dejará de funcionar de inmediato: nadie más podrá entrar al estudio con él.')) return;
        const res = await fetch('/api/admin/sesion_aplicacion/cerrar', { method: 'POST' });

            <table style="width:100%;border-collapse:collapse;font-size:0.92rem;"><tr><th style="text-align:left;padding:8px 6px;">Semestre</th>${d.grupos.map(g => `<th>${et[g]}</th>`).join('')}<th>Total</th></tr>${filas}

    // ===== Psicometría de la prueba de rotación mental (con las respuestas ítem por ítem guardadas en el registro) =====
    async function mostrarPsicometriaRotacion(todos) {
        let d;
        try {
            const res = await fetch('/api/admin/rotacion/psicometria' + (todos ? '?todos=1' : ''));
            if (!res.ok) throw new Error('HTTP ' + res.status);
            d = await res.json();
        } catch (e) { mostrarMensaje('❌ No se pudo calcular la fiabilidad', '#FF375F'); return; }
        const viejo = document.getElementById('modalPsicometria'); if (viejo) viejo.remove();
        const ov = document.createElement('div'); ov.id = 'modalPsicometria';
        ov.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(5,7,12,0.9);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:20px;';
        const interpreta = k => k === null || k === undefined ? '—' : (k >= 0.8 ? 'buena' : k >= 0.7 ? 'aceptable' : k >= 0.6 ? 'baja (mejorable)' : 'insuficiente');
        let cuerpo;
        if (d.items) {
            cuerpo = `<p style="line-height:1.7;">Participantes con detalle: <strong>${d.n}</strong> · Media: <strong>${d.media}</strong> de ${d.k} (DE ${d.desviacion})<br>
                <strong>Fiabilidad KR-20: ${d.kr20 === null ? 'no calculable' : d.kr20}</strong> (${interpreta(d.kr20)})<br>
                No alcanzó los 12 ítems: <strong>${d.pct_no_alcanzo_12_items}%</strong> · Terminó por tiempo: <strong>${d.pct_termino_por_tiempo}%</strong> · Tiempo medio: ${d.tiempo_medio_s} s de 180</p>
                ${d.aviso ? `<p style="background:#FFB02018;border-left:4px solid #FFB020;padding:8px 12px;border-radius:6px;">⚠️ ${d.aviso}</p>` : ''}
                <table style="width:100%;border-collapse:collapse;font-size:0.9rem;"><tr><th style="text-align:left;">Ítem</th><th>Dificultad (p)</th><th>Discriminación (r)</th><th style="text-align:left;">Observación</th></tr>
                ${d.items.map(i => { const obs = []; if (i.dificultad_p < 0.2) obs.push('muy difícil'); if (i.dificultad_p > 0.9) obs.push('muy fácil'); if (i.discriminacion_rpb !== null && i.discriminacion_rpb < 0.2) obs.push('discrimina poco'); return `<tr style="border-top:1px solid #00D4FF20;"><td>${i.item}</td><td style="text-align:center;">${i.dificultad_p}</td><td style="text-align:center;">${i.discriminacion_rpb === null ? '—' : i.discriminacion_rpb}</td><td style="color:#FFB020;">${obs.join(', ')}</td></tr>`; }).join('')}</table>
                <p style="color:#A0A0B0;font-size:0.8rem;margin-top:10px;">Dificultad p = proporción que acierta el ítem (ideal 0,2–0,9). Discriminación r = correlación del ítem con el resto de la prueba (ideal ≥ 0,2). Los ítems no alcanzados cuentan como incorrectos. KR-20 ≥ 0,70 suele considerarse aceptable.</p>`;
        } else {
            cuerpo = `<p style="background:#FFB02018;border-left:4px solid #FFB020;padding:8px 12px;border-radius:6px;">${d.aviso || 'Sin datos todavía.'}<br>Participantes con detalle: ${d.n}</p>`;
        }
        ov.innerHTML = `<div style="background:#121826;border:2px solid #00D4FF60;border-radius:16px;padding:22px;max-width:760px;width:100%;color:#E0E0E0;">
            <h2 style="color:#00D4FF;margin:0 0 10px;">🧩 Prueba de rotación mental — psicometría</h2>
            <p style="color:#A0A0B0;font-size:0.85rem;">${todos ? 'Incluye todos los roles (docentes, validadores y pruebas).' : 'Solo participantes de tipo estudiante.'}</p>
            ${cuerpo}
            <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;">
                <button class="btn btn-secondary" onclick="mostrarPsicometriaRotacion(${!todos})">${todos ? 'Ver solo estudiantes' : 'Incluir todos los roles'}</button>
                <button class="btn btn-secondary" onclick="document.getElementById('modalPsicometria').remove()">Cerrar</button>
            </div></div>`;
        document.body.appendChild(ov);
    }

    // ===== Copia COMPLETA de la base (cuentas, sesiones, resultados, pasos, reflexiones, encuestas y configuración) =====
    async function descargarCopiaCompleta() {
        try {
            mostrarMensaje('⏳ Preparando la copia completa…', '#FFB020');
            const res = await fetch('/api/admin/migracion/exportar');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const datos = await res.json();
            const c = datos.conteos || {};
            const blob = new Blob([JSON.stringify(datos)], { type: 'application/json' });
            const url = URL.createObjectURL(blob), a = document.createElement('a');
            a.href = url; a.download = `copia_completa_base_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
            mostrarMensaje(`✅ Copia completa descargada: ${c.usuarios || 0} cuentas, ${c.sesiones || 0} sesiones, ${c.resultados || 0} resultados, ${c.pasos_clave || 0} pasos`);
        } catch (e) {
            mostrarMensaje('❌ No se pudo descargar la copia completa', '#FF375F');
        }
    }

    async function restaurarCopiaCompleta(input) {
        const archivo = input.files && input.files[0];
        input.value = '';
        if (!archivo) return;
        let datos;
        try { datos = JSON.parse(await archivo.text()); }
        catch (e) { mostrarMensaje('❌ El archivo no es un JSON válido', '#FF375F'); return; }
        const c = datos.conteos || {};
        if (!confirm(`Se restaurará la copia completa: ${c.usuarios || 0} cuentas, ${c.sesiones || 0} sesiones, ${c.resultados || 0} resultados, ${c.pasos_clave || 0} pasos.\n\nSolo funciona en una base NUEVA y VACÍA. ¿Continuar?`)) return;
        try {
            mostrarMensaje('⏳ Restaurando…', '#FFB020');
            const res = await fetch('/api/admin/migracion/importar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
            const r = await res.json().catch(() => ({}));
            if (res.ok) {
                const t = r.restaurado || {};
                alert(`✅ Copia restaurada.\nCuentas: ${t.usuarios}\nSesiones: ${t.sesiones}\nResultados: ${t.resultados}\nPasos: ${t.pasos_clave}\nReflexiones: ${t.reflexiones}\nEncuestas: ${t.encuestas}`);
                location.reload();
            } else {
                alert('❌ ' + (r.error || 'No se pudo restaurar'));
            }
        } catch (e) {
            mostrarMensaje('❌ No se pudo restaurar la copia completa', '#FF375F');
        }
    }

    function renderTablaUsuarios(lista) {
        document.getElementById('tbodyUsuarios').innerHTML = lista.map(u => {
            const badgeClass = {'2D':'badge-2d','2D_META':'badge-2d-meta','3D':'badge-3d','3D_META':'badge-3d-meta'}[u.grupo_asignado] || 'badge-sin';
            const texto = u.grupo_asignado || 'Pendiente';
            // Los 4 botones de grupo SIEMPRE están: el grupo actual aparece marcado (✓) y los demás permiten cambiarlo (útil en las cuentas de pruebas)
            const botonesGrupo = [['2D', '2D', 'btn-2d'], ['2D_META', '2D+M', 'btn-2d-meta'], ['3D', '3D', 'btn-3d'], ['3D_META', '3D+M', 'btn-3d-meta']].map(([g, et, cl]) =>
                g === u.grupo_asignado
                    ? `<button class="btn-sm ${cl}" style="outline:2px solid #fff;outline-offset:1px;cursor:default;" disabled title="Grupo actual">✓ ${et}</button>`
                    : `<button class="btn-sm ${cl}" onclick="asignarGrupo(${u.id},'${g}')" title="${u.grupo_asignado ? 'Cambiar a este grupo' : 'Asignar a este grupo'}">${et}</button>`).join('\n                    ');
            const btns = `<div class="btn-group">
                    ${botonesGrupo}
                    <button class="btn-sm" style="background:#7B61FF;color:white;" onclick="resetearPassword(${u.id})" title="Poner clave nueva">🔑</button>
                    <button class="btn-sm" style="background:#30D158;color:#06210F;" onclick="abrirAnularIntento(${u.id})" title="Anular el intento y habilitar uno nuevo (NO borra datos)${u.n_anuladas ? ' · ya tiene ' + u.n_anuladas + ' intento(s) anulado(s)' : ''}">🔁${u.n_anuladas ? '<sup>' + u.n_anuladas + '</sup>' : ''}</button>
                    <button class="btn-sm btn-danger"  onclick="eliminarUsuario(${u.id})">🗑️</button>

                <td>${u.correo}</td>
                <td><span style="color:${(u.rol && u.rol !== 'estudiante' && u.rol !== 'usuario') ? '#FFB020' : '#A0A0B0'};">${u.rol === 'usuario' || !u.rol ? 'estudiante' : u.rol}</span></td>
                <td>${u.institucion || '—'}</td>
                <td>${u.semestre || '—'}</td>
                <td>${u.experiencia_taxonomica ?? '—'}/5</td>
                <td>${u.habilidad_espacial ?? '—'}/20</td>
                <td>${u.genero || '—'}</td>
                <td><span class="badge ${badgeClass}">${texto}</span></td>

    function filtrarTabla() {
        const q = document.getElementById('buscarUsuario').value.toLowerCase();
        const filtrados = usuarios.filter(u =>
            u.nombre_usuario.toLowerCase().includes(q) ||
            u.correo.toLowerCase().includes(q)
        );
        renderTablaUsuarios(filtrados);
    }

    async function asignarGrupo(id, grupo, forzar) {
    const u = usuarios.find(x => x.id === id), actual = u && u.grupo_asignado;
    if (!forzar) {
        let msg = actual ? `¿Cambiar a ${u.nombre_usuario} del grupo ${actual} al grupo ${grupo}?` : `¿Asignar al grupo ${grupo}?`;
        if (actual && u.rol === 'pruebas') msg += '\n\nEs una cuenta de pruebas: el cambio vale desde su próximo intento. Si tiene la clave abierta, que vuelva al panel y la inicie de nuevo.';
        if (!confirm(msg)) return;
    }
    const res = await fetch('/api/admin/asignar_grupo', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ usuario_id: id, grupo, forzar: !!forzar })
    });
    if (res.status === 409) {                       // participante real que ya hizo el ejercicio: confirmación extra
        const d = await res.json();
        if (confirm('⚠️ ' + d.error + '\n\nSolo cámbialo si fue un error de asignación. ¿Cambiarlo de todas formas?')) return asignarGrupo(id, grupo, true);
        return;
    }
    if (res.ok) {
        mostrarMensaje(`✅ ${u ? u.nombre_usuario : 'Usuario'}: grupo ${grupo}`);
        if (u) u.grupo_asignado = grupo;
        renderTablaUsuarios(usuarios);
    } else {
        mostrarMensaje('❌ Error al asignar grupo', '#FF375F');
    }
}

    async function asignarGrupoLote() {
        const pendientes = usuarios.filter(u => !u.grupo_asignado).length;
        if (pendientes === 0) { mostrarMensaje('ℹ️ Todos los usuarios ya tienen grupo asignado'); return; }
        if (!confirm(`¿Asignar grupo a los usuarios sin grupo? A los estudiantes que entraron con el código se les reparte con equilibrio dentro de su semestre; los que no escribieron el código se quedan sin grupo (se asignan a mano).`)) return;
        const res = await fetch('/api/admin/asignar_grupo_lote', { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
            mostrarMensaje(`✅ ${data.mensaje}`);
            // Recargar usuarios
            const u = await fetch('/api/admin/usuarios').then(r => r.json());
            usuarios = u;
            mostrarUsuarios();
        } else {
            mostrarMensaje('❌ Error en asignación', '#FF375F');
        }
    }

    // ===== Anular y habilitar un intento nuevo (NO borra datos: el intento anulado se conserva, marcado, y deja de contar en las estadísticas) =====
const ESTADO_INTENTO = { sin_iniciar: 'Sin intento vigente', abandonado: 'Incompleto (no terminó las 2 identificaciones)', encuestas_pendientes: 'Terminó las identificaciones; faltan las encuestas', completado: 'Completo (identificaciones y encuestas)' };
async function abrirAnularIntento(id) {
    let info;
    try { const r = await fetch(`/api/admin/usuarios/${id}/estado_intento`); info = await r.json(); if (!r.ok) throw new Error(info.error || 'HTTP ' + r.status); }
    catch (e) { mostrarMensaje('❌ No se pudo leer el estado del intento: ' + e.message, '#FF375F'); return; }
    document.getElementById('modalAnular')?.remove();
    const hay = info.sesion_id !== null, vio = info.resultados >= 1;
    const fila = (k, v) => `<div style="display:flex;gap:10px;margin:3px 0;"><span style="color:#A0A0B0;min-width:190px;">${k}</span><span>${v}</span></div>`;
    const cuerpo = !hay
        ? `<div style="background:#1A1F36;border-radius:10px;padding:14px;color:#E0E0E0;">Esta persona <strong>no tiene un intento vigente</strong>: ya puede iniciar el ejercicio. No hay nada que anular.${info.intentos_anulados ? `<br><span style="color:#A0A0B0;">Tiene ${info.intentos_anulados} intento(s) anulado(s) conservado(s).</span>` : ''}</div>`
        : `<div style="background:#1A1F36;border-radius:10px;padding:12px 14px;font-size:0.88rem;color:#E0E0E0;line-height:1.5;">
              ${fila('Estado del intento', ESTADO_INTENTO[info.estado] || info.estado)}${fila('Identificaciones hechas', info.resultados + ' de 2')}${fila('Pasos registrados', info.pasos)}
              ${fila('Encuestas guardadas', info.encuestas.length ? info.encuestas.join(', ') : 'ninguna')}${fila('Inició (hora de Colombia)', info.inicio || '—')}${fila('Especies que vio', info.especies.join(', ') || '—')}${fila('Intentos anulados antes', info.intentos_anulados)}</div>
           <div style="margin-top:14px;color:#E0E0E0;font-size:0.88rem;">Motivo (queda guardado con el intento):</div>
           <select id="anularMotivo" style="width:100%;margin:6px 0;padding:9px;border-radius:8px;background:#1A1F36;color:#E0E0E0;border:1px solid #00D4FF40;">
              <option>Cerró la ventana por error</option><option>No entendió el ejercicio</option><option>Falla técnica o bloqueo</option><option>Se pulsaron respuestas sin querer</option><option>Otro</option></select>
           <textarea id="anularDetalle" rows="2" placeholder="Detalle (opcional)" style="width:100%;box-sizing:border-box;padding:9px;border-radius:8px;background:#1A1F36;color:#E0E0E0;border:1px solid #00D4FF40;"></textarea>
           <div style="margin-top:12px;font-size:0.82rem;color:#A0A0B0;line-height:1.55;">✅ <strong style="color:#E0E0E0;">No se borra nada.</strong> El intento actual se conserva con todos sus datos, marcado como anulado con este motivo, y deja de contar en el panel, las estadísticas y el análisis. La persona podrá iniciar de nuevo con 2 especies que <strong>no haya visto</strong> antes.</div>
           ${vio ? `<div style="margin-top:12px;background:#FFB02015;border:1px solid #FFB02060;border-radius:10px;padding:10px 14px;font-size:0.82rem;color:#FFD580;line-height:1.5;">⚠️ Ya hizo <strong>${info.resultados}</strong> identificación(es) y <strong>vio la respuesta correcta</strong>. Su nuevo intento no será del todo comparable con el de los demás: en la exportación queda marcado como <em>reintento_tras_anulacion</em> para que decidas si lo incluyes.
              <label style="display:block;margin-top:8px;color:#FFE9B8;"><input type="checkbox" id="anularConfirmar"> Entiendo esto y quiero anular el intento</label></div>` : ''}`;
    const ov = document.createElement('div'); ov.id = 'modalAnular';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
    ov.innerHTML = `<div style="background:#121826;border:2px solid #00D4FF60;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;color:#E0E0E0;">
        <div style="font-size:1.15rem;font-weight:700;color:#00D4FF;margin-bottom:4px;">🔁 Anular y habilitar un nuevo intento</div><div style="color:#A0A0B0;margin-bottom:12px;">${escapeHtmlAdmin(info.usuario)} · grupo ${escapeHtmlAdmin(info.grupo || 'sin grupo')}</div>${cuerpo}
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;"><button class="btn btn-secondary" onclick="document.getElementById('modalAnular').remove()">Cancelar</button>
        ${hay ? `<button class="btn btn-primary" id="btnAnularOk" onclick="confirmarAnularIntento(${id}, ${vio})" ${vio ? 'disabled' : ''} style="background:linear-gradient(45deg,#FF375F,#FF8A00);">🔁 Anular y habilitar</button>` : ''}</div></div>`;
    document.body.appendChild(ov);
    const chk = document.getElementById('anularConfirmar'); if (chk) chk.addEventListener('change', () => { document.getElementById('btnAnularOk').disabled = !chk.checked; });
}
function escapeHtmlAdmin(t) { return String(t === null || t === undefined ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
async function confirmarAnularIntento(id, vio) {
    const body = { motivo: document.getElementById('anularMotivo').value, detalle: document.getElementById('anularDetalle').value.trim(), confirmar: vio && !!document.getElementById('anularConfirmar')?.checked };
    const btn = document.getElementById('btnAnularOk'); btn.disabled = true;
    try {
        const res = await fetch(`/api/admin/usuarios/${id}/anular_intento`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { mostrarMensaje('⚠️ ' + (data.error || 'No se pudo anular el intento'), '#FFB020'); btn.disabled = false; return; }
        document.getElementById('modalAnular')?.remove(); mostrarMensaje('✅ ' + data.mensaje);
        if (typeof cargarDatosPanel === 'function') cargarDatosPanel(true);
    } catch (e) { mostrarMensaje('❌ ' + e.message, '#FF375F'); btn.disabled = false; }
}

async function eliminarUsuario(id) {
        const u = usuarios.find(u => u.id === id);
        if (!confirm(`¿Eliminar a "${u?.nombre_usuario}"? Se perderán TODOS sus datos.`)) return;
        const res = await fetch(`/api/admin/usuarios/${id}`, { method: 'DELETE' });
        if (res.ok) {
            mostrarMensaje('✅ Usuario eliminado');
            usuarios = usuarios.filter(u => u.id !== id);
            renderTablaUsuarios(usuarios);
        } else {
            mostrarMensaje('❌ Error al eliminar', '#FF375F');
        }
    }

    async function resetearPassword(id) {
        const u = usuarios.find(u => u.id === id);
        const nueva = prompt(`Nueva contraseña temporal para "${u?.nombre_usuario}" (mínimo 4 caracteres):`);
        if (!nueva) return;
        if (nueva.trim().length < 4) {
            mostrarMensaje('❌ La contraseña debe tener al menos 4 caracteres', '#FF375F');
            return;
        }
        const res = await fetch(`/api/admin/usuarios/${id}/resetear_password`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ nueva_password: nueva.trim() })
        });
        if (res.ok) {
            mostrarMensaje(`✅ Contraseña de ${u?.nombre_usuario} actualizada. Comunícasela por tu cuenta.`);
        } else {
            const data = await res.json().catch(()=>({}));
            mostrarMensaje(`❌ ${data.error || 'Error al resetear contraseña'}`, '#FF375F');
        }
    }

            especiesConfig.activas = especiesConfig.activas.filter(i => i !== id);
        else
            especiesConfig.activas.push(id);

    async function guardarEspecies() {
        if (especiesConfig.activas.length < 2) {
            mostrarMensaje('⚠️ Activa al menos 2 especies: cada participante identifica 2 distintas', '#FF375F');
            return;
        }
        const res = await fetch('/api/admin/config/especies', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ activas: especiesConfig.activas })
        });
        let detalle = ''; if (!res.ok) { try { detalle = (await res.json()).error || ''; } catch (e) {} }
        mostrarMensaje(res.ok ? '✅ Configuración guardada' : '❌ ' + (detalle || 'Error al guardar'), res.ok ? '#00D4FF' : '#FF375F');
    }

    // ===== ESTADÍSTICAS =====
    function mostrarEstadisticas() {
        const grupos = ['2D','2D_META','3D','3D_META'];
        const total  = resultados.length;
        const aciertos = resultados.filter(r=>r.acerto).length;
        const precision = total > 0 ? Math.round((aciertos/total)*100) : 0;
        const tiempoProm = total > 0 ? Math.round(resultados.reduce((s,r)=>s+(r.tiempo||0),0)/total) : 0;

        const filas = grupos.map(g => {
            const rg = resultados.filter(r=>r.grupo===g);
            const ag = rg.filter(r=>r.acerto).length;
            const pg = rg.length > 0 ? Math.round((ag/rg.length)*100) : 0;
            const tg = rg.length > 0 ? Math.round(rg.reduce((s,r)=>s+(r.tiempo||0),0)/rg.length) : 0;
            const eg = encuestas.filter(e=>e.grupo===g&&e.tipo==='SUS');
            const sg = eg.length > 0 ? Math.round(eg.reduce((s,e)=>s+(e.puntaje_total||0),0)/eg.length) : '—';
            const ug = usuarios.filter(u=>u.grupo_asignado===g).length;
            return `<tr><td><strong>${g}</strong></td><td>${ug}</td><td>${rg.length}</td><td>${pg}%</td><td>${tg}s</td><td>${sg}${sg!=='—'?'/100':''}</td></tr>`;
        }).join('');

        document.getElementById('tabContent').innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-number">${usuarios.length}</div><div class="stat-label">Usuarios</div></div>
                <div class="stat-card"><div class="stat-number">${total}</div><div class="stat-label">Identificaciones</div></div>
                <div class="stat-card"><div class="stat-number">${precision}%</div><div class="stat-label">Precisión global</div></div>
                <div class="stat-card"><div class="stat-number">${tiempoProm}s</div><div class="stat-label">Tiempo promedio</div></div>
            </div>
            <div class="card">
                <div class="card-title">📊 Resultados por grupo</div>
                <div class="table-wrap">
                    <table><thead><tr><th>Grupo</th><th>N</th><th>Identif.</th><th>Precisión</th><th>Tiempo prom.</th><th>SUS prom.</th></tr></thead>
                    <tbody>${filas}</tbody></table>
                </div>
            </div>`;
    }

    // ===== GRÁFICOS =====
    function mostrarGraficos() {
        const grupos = ['2D','2D_META','3D','3D_META'];
        const labels = ['2D','2D+Meta','3D','3D+Meta'];
        const colores = ['#00D4FF','#00D4FF80','#7B61FF','#7B61FF80'];

        const precision = grupos.map(g=>{ const r=resultados.filter(r=>r.grupo===g); return r.length?Math.round(r.filter(r=>r.acerto).length/r.length*100):0; });
        const tiempo    = grupos.map(g=>{ const r=resultados.filter(r=>r.grupo===g); return r.length?Math.round(r.reduce((s,r)=>s+(r.tiempo||0),0)/r.length):0; });
        const sus       = grupos.map(g=>{ const e=encuestas.filter(e=>e.grupo===g&&e.tipo==='SUS'); return e.length?Math.round(e.reduce((s,e)=>s+(e.puntaje_total||0),0)/e.length):0; });

        document.getElementById('tabContent').innerHTML = `
            <div class="charts-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;">
                <div style="background:#1A1F36;border-radius:15px;padding:20px;"><div class="card-title">📊 Precisión por grupo</div><canvas id="chPrecision"></canvas></div>
                <div style="background:#1A1F36;border-radius:15px;padding:20px;"><div class="card-title">⏱️ Tiempo promedio (s)</div><canvas id="chTiempo"></canvas></div>
                <div style="background:#1A1F36;border-radius:15px;padding:20px;"><div class="card-title">📋 Puntaje SUS</div><canvas id="chSUS"></canvas></div>
                <div style="background:#1A1F36;border-radius:15px;padding:20px;"><div class="card-title">🥧 Distribución aciertos</div><canvas id="chDist"></canvas></div>
            </div>`;
        setTimeout(() => {
            const opts = (max) => ({ responsive:true, plugins:{legend:{labels:{color:'#E0E0E0'}}}, scales:{y:{beginAtZero:true, max, ticks:{color:'#A0A0B0'}}, x:{ticks:{color:'#A0A0B0'}}}});
            new Chart(document.getElementById('chPrecision'), { type:'bar', data:{ labels, datasets:[{ label:'Precisión (%)', data:precision, backgroundColor:colores, borderRadius:8 }] }, options:opts(100) });
            new Chart(document.getElementById('chTiempo'),    { type:'bar', data:{ labels, datasets:[{ label:'Tiempo (s)',    data:tiempo,    backgroundColor:colores, borderRadius:8 }] }, options:opts(null) });
            new Chart(document.getElementById('chSUS'),       { type:'bar', data:{ labels, datasets:[{ label:'SUS',           data:sus,       backgroundColor:colores, borderRadius:8 }] }, options:opts(100) });
            const tot = resultados.length;
            const ac  = resultados.filter(r=>r.acerto).length;
            new Chart(document.getElementById('chDist'), { type:'doughnut', data:{ labels:['✅ Correctos','❌ Incorrectos'], datasets:[{ data:[ac, tot-ac], backgroundColor:['#00D4FF','#FF375F'], borderWidth:0 }] }, options:{ responsive:true, plugins:{legend:{position:'bottom',labels:{color:'#E0E0E0'}}} } });
        }, 80);
    }

    // ===== ANÁLISIS =====
    function mostrarAnalisisEstadistico() {
        const g2d = resultados.filter(r=>r.grupo==='2D'||r.grupo==='2D_META');
        const g3d = resultados.filter(r=>r.grupo==='3D'||r.grupo==='3D_META');
        const ac2d = g2d.filter(r=>r.acerto).length;
        const ac3d = g3d.filter(r=>r.acerto).length;
        const p2d = g2d.length > 0 ? (ac2d/g2d.length*100).toFixed(1) : 0;
        const p3d = g3d.length > 0 ? (ac3d/g3d.length*100).toFixed(1) : 0;
        const t2d = g2d.length > 0 ? (g2d.reduce((s,r)=>s+(r.tiempo||0),0)/g2d.length).toFixed(1) : 0;
        const t3d = g3d.length > 0 ? (g3d.reduce((s,r)=>s+(r.tiempo||0),0)/g3d.length).toFixed(1) : 0;
        const diffP = (p3d - p2d).toFixed(1);
        const diffT = t2d > 0 ? ((t2d - t3d)/t2d*100).toFixed(1) : 0;

        document.getElementById('tabContent').innerHTML = `
            <div class="card">
                <div class="card-title">📊 Análisis 2D vs 3D</div>
                <div class="table-wrap">
                    <table><thead><tr><th>Indicador</th><th>Grupo 2D (n=${g2d.length})</th><th>Grupo 3D (n=${g3d.length})</th><th>Diferencia</th></tr></thead>
                    <tbody>

    function renderReflexionesFiltradas() {
        const grupoSel = document.getElementById('filtroGrupoReflexiones')?.value || '';
        const usuarioSel = document.getElementById('filtroUsuarioReflexiones')?.value || '';

        const reflexionesF = reflexiones.filter(r =>
            (!grupoSel || r.grupo === grupoSel) && (!usuarioSel || r.usuario === usuarioSel)
        );
        const pasosF = pasos.filter(p =>
            (!grupoSel || p.grupo === grupoSel) && (!usuarioSel || p.usuario === usuarioSel)
        );

        // ----- Bloque de reflexiones metacognitivas (pre/durante/post) -----
        const filasReflexiones = reflexionesF.map(r=>`
            <tr>
                <td>${r.usuario}</td><td>${r.grupo}</td><td>${r.momento||'—'}</td>
                <td style="max-width:300px;font-size:0.82rem;">${(r.respuesta_raw||'').substring(0,120)}${(r.respuesta_raw||'').length>120?'…':''}</td>
            </tr>`).join('');

        // ----- Bloque de recorrido paso a paso por la clave -----
        // Agrupar por usuario + especimen para armar el recorrido completo
        const grupos_pasos = {};
        pasosF.forEach(p => {
            const key = `${p.usuario}||${p.sesion_id}||${p.especimen_id}`;
            if (!grupos_pasos[key]) grupos_pasos[key] = { usuario:p.usuario, grupo:p.grupo, especimen_id:p.especimen_id, pasos:[] };
            grupos_pasos[key].pasos.push(p);
        });

        const bloquesRecorrido = Object.values(grupos_pasos).map(g => {
            g.pasos.sort((a,b)=>a.orden_paso - b.orden_paso);
            const tiempoTotal = g.pasos.reduce((s,p)=>s+(p.tiempo_segundos||0),0);
            const pasosRapidos = g.pasos.filter(p=>p.tiempo_segundos < 2).length;
            const ultimoPaso = g.pasos[g.pasos.length-1];
            const conclusionOk = ultimoPaso ? ultimoPaso.es_paso_correcto : null;
            const alertaConciencia = pasosRapidos >= Math.ceil(g.pasos.length/2)
                ? '<span style="color:#FFB020;" title="La mitad o más de sus respuestas tomaron menos de 2s">⚡ Posible clic sin leer</span>'
                : '<span style="color:#00D4FF;">✓ Ritmo razonable</span>';

            // Solo la PRIMERA pregunta equivocada es "se desvió aquí"; las siguientes son ruta alternativa
            const idxDesvio = g.pasos.findIndex(p => !p.es_paso_correcto);
            const etiquetaPaso = (i) => {
                if (idxDesvio === -1 || i < idxDesvio) return { txt: '✅', color: '#00D4FF' };
                if (i === idxDesvio) return { txt: '❌ se desvió aquí', color: '#FF375F' };
                return { txt: '↪ ruta alternativa', color: '#A0A0B0' };
            };
            const filasPaso = g.pasos.map((p, i) => `
                <tr>
                    <td>Pareado ${p.pregunta}</td>
                    <td>Opción ${p.opcion_elegida===0?'A':'B'}</td>
                    <td style="color:${etiquetaPaso(i).color};">${etiquetaPaso(i).txt}</td>
                    <td>${(p.tiempo_segundos||0).toFixed(1)}s ${p.tiempo_segundos<2?'⚡':''}</td>
                </tr>`).join('');

            return `<div class="stat-card" style="margin-bottom:12px;text-align:left;">
                <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
                    <strong style="color:#00D4FF;">${g.usuario}</strong>
                    <span class="badge">${g.grupo||'—'}</span>
                    <span style="color:#A0A0B0;">Espécimen: ${g.especimen_id}</span>
                    <span>Tiempo total: <strong>${tiempoTotal.toFixed(1)}s</strong></span>
                    ${alertaConciencia}
                </div>
                <table style="width:100%;font-size:0.85rem;">
                    <thead><tr style="color:#00D4FF;"><th style="text-align:left;">Paso</th><th style="text-align:left;">Eligió</th><th style="text-align:left;">Resultado</th><th style="text-align:left;">Tiempo</th></tr></thead>
                    <tbody>${filasPaso}</tbody>
                </table>
            </div>`;
        }).join('');

        document.getElementById('contenidoReflexionesFiltradas').innerHTML = `
            <div class="card-title" style="font-size:1rem;margin-top:10px;">🧭 Recorrido detallado por la clave (${Object.keys(grupos_pasos).length} espécimen(es))</div>
            ${bloquesRecorrido || '<div style="text-align:center;padding:20px;color:#A0A0B0;">Sin recorridos registrados con este filtro.</div>'}

            <div class="card-title" style="font-size:1rem;margin-top:25px;">💭 Reflexiones metacognitivas (${reflexionesF.length})</div>
            <div class="table-wrap">
                <table><thead><tr><th>Usuario</th><th>Grupo</th><th>Momento</th><th>Respuesta</th></tr></thead>
                <tbody>${filasReflexiones || '<tr><td colspan="4" style="text-align:center;padding:20px;">Sin reflexiones con este filtro.</td></tr>'}</tbody></table>
            </div>`;
    }

    function exportarPasosCSV() {
        const etiquetas = {};
        const porEsp = {};
        pasos.forEach(p => { const k = `${p.sesion_id}||${p.especimen_id}`; (porEsp[k] = porEsp[k] || []).push(p); });
        Object.values(porEsp).forEach(lista => {
            lista.sort((x, y) => x.orden_paso - y.orden_paso);
            const idx = lista.findIndex(p => !p.es_paso_correcto);
            lista.forEach((p, i) => { etiquetas[`${p.sesion_id}||${p.especimen_id}||${p.orden_paso}`] = (idx === -1 || i < idx) ? 'correcto' : (i === idx ? 'desvio' : 'ruta_alternativa'); });
        });
        let csv = 'Usuario,Grupo,Sesion,Especimen,Pregunta,OpcionElegida,PasoCorrecto,EtiquetaPaso,PasoFinal,TiempoSegundos,OrdenPaso\n';
        pasos.forEach(p => {
            csv += `"${p.usuario}","${p.grupo}",${p.sesion_id},"${p.especimen_id}",${p.pregunta},${p.opcion_elegida===0?'A':'B'},${p.es_paso_correcto},${etiquetas[`${p.sesion_id}||${p.especimen_id}||${p.orden_paso}`]},${p.es_paso_final},${p.tiempo_segundos},${p.orden_paso}\n`;
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' }));
        a.download = `recorrido_detallado_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
        mostrarMensaje('✅ Recorrido detallado exportado');
    }

    // ===== CALIBRAR EL ENCUADRE DE CADA RASGO (2D: vista + punto + escala; 3D: orientar el modelo) =====

 "nombre": "Cantidad de setas en el dorso de la cabeza", "A": "Dorso de la cabeza con más de 5 setas erectas", "B": "Dorso de la cabeza nunca con más de 5 setas"}, {"id": "p5b", "pareado": 5, "nombre": "Forma del mesosoma", "A": "mesosoma esbelto", "B": "mesosoma más robusto"}, {"id": "p5c", "pareado": 5, "nombre": "Impresión media del mesonoto", "A": "dorso del mesonoto con una impresión media moderada a fuerte", "B": "mesonoto con una impresión media ligeramente impresa o ausente"}, {"id": "p5d", "pareado": 5, "nombre": "Brillo de la superficie del cuerpo", "A": "superficie del cuerpo brillante y lustrosa", "B": "cuerpo no tan brillante y lustroso como arriba"}, {"id": "p6a", "pareado": 6, "nombre": "Densidad de setas erectas", "A": "Pronoto con más de 10 setas erectas, superficie de todo el cuerpo con setas erectas largas o cortas", "B": "Pronoto con menos de 10 setas erectas, superficie de todo el cuerpo nunca cubierto con muchas setas erectas"}, {"id": "p7a", "pareado": 7, "nombre": "Margen posterior de la cabeza", "A": "Margen posterior de la cabeza profundamente cóncavo", "B": "Margen posterior de la cabeza recto a ligeramente cóncavo"}, {"id": "p7b", "pareado": 7, "nombre": "Impresión media del mesonoto", "A": "dorso del mesonoto nunca con una impresión media", "B": "dorso del mesonoto con una ligera impresión media o sin impresión"}, {"id": "p7c", "pareado": 7, "nombre": "Setas en el pronoto", "A": "pronoto usualmente con 4 (2–8) setas erectas a suberectas", "B": "pronoto nunca con más de 4 setas erectas"}, {"id": "p8a", "pareado": 8, "nombre": "Escapos antenales frente al pedicelo", "A": "Escapos antenales cortos, sobrepasando el margen posterior de la cabeza por una longitud inferior a la del pedicelo", "B": "Escapos antenales relativamente largos, sobrepasando el margen posterior de la cabeza por una longitud igual o superior a la del pedicelo"}, {"id": "p8b", "pareado": 8, "nombre": "Forma del propodeo", "A": "propodeo relativamente alto, con caras anterior dorsal y posterior distinguibles, a veces la cara dorsal ligeramente deprimida", "B": "propodeo usualmente redondeado, no como arriba"}];
    const VISTAS_2D = [{ id: 'lateral', t: 'Lateral' }, { id: 'cabeza', t: 'Frontal (cabeza)' }, { id: 'dorsal', t: 'Dorsal' }];
    let zoomCaracteresEdicion = {};

    function rasgoPorId(id) { return RASGOS_CALIBRACION.find(r => r.id === id); }

    // Calibraciones antiguas (una por pregunta 1–8): la pregunta N correspondía al primer rasgo del pareado N (pNa)
    function migrarCalibracionesAntiguas(d) {
        const salida = {};
        Object.entries(d || {}).forEach(([k, v]) => {
            if (/^\d+$/.test(k)) { if (!(('p' + k + 'a') in d)) salida['p' + k + 'a'] = v; }
            else salida[k] = v;
        });
        return salida;
    }
