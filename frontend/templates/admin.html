<!DOCTYPE html>
<html lang="es">
<head>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Clave Linepithema</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0A0E17;color:#E0E0E0;font-family:'Segoe UI',sans-serif;padding:20px;}
        .container{max-width:1400px;margin:0 auto;}
        h1{background:linear-gradient(45deg,#00D4FF,#7B61FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:1.8rem;}
        .subtitle{color:#A0A0B0;margin-bottom:25px;border-bottom:1px solid #00D4FF30;padding-bottom:10px;font-size:0.9rem;}
        .tabs{display:flex;gap:8px;margin-bottom:25px;flex-wrap:wrap;}
        .tab{padding:10px 20px;background:#1A1F36;border:1px solid #00D4FF40;border-radius:8px;cursor:pointer;font-weight:600;font-size:0.9rem;transition:all 0.2s;}
        .tab:hover{border-color:#00D4FF80;}
        .tab.active{background:linear-gradient(45deg,#00D4FF20,#7B61FF20);border-color:#00D4FF;color:#00D4FF;}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:25px;}
        .stat-card{background:#121826;border:1px solid #00D4FF40;border-radius:15px;padding:20px;text-align:center;}
        .stat-number{font-size:2rem;font-weight:bold;color:#00D4FF;}
        .stat-label{color:#A0A0B0;font-size:0.85rem;margin-top:6px;}
        .card{background:#121826;border:1px solid #00D4FF40;border-radius:15px;padding:25px;margin-bottom:25px;}
        .card-title{color:#00D4FF;border-bottom:1px solid #00D4FF30;padding-bottom:10px;margin-bottom:20px;font-weight:bold;}
        .table-wrap{overflow-x:auto;}
        table{width:100%;border-collapse:collapse;}
        th{text-align:left;padding:12px;background:#1A1F36;color:#00D4FF;font-size:0.85rem;}
        td{padding:10px 12px;border-bottom:1px solid #1A1F36;font-size:0.85rem;}
        .badge{padding:3px 8px;border-radius:12px;font-size:0.78rem;}
        .badge-2d{background:#00D4FF20;color:#00D4FF;}
        .badge-2d-meta{background:#00D4FF40;color:#00D4FF;}
        .badge-3d{background:#7B61FF20;color:#7B61FF;}
        .badge-3d-meta{background:#7B61FF40;color:#7B61FF;}
        .badge-sin{background:#FFAA0020;color:#FFAA00;}
        .btn-group{display:flex;gap:4px;flex-wrap:wrap;}
        .btn-sm{padding:5px 10px;font-size:0.78rem;border:none;border-radius:5px;cursor:pointer;font-weight:600;}
        .btn-2d{background:#00D4FF;color:#0A0E17;}
        .btn-2d-meta{background:#00D4FF80;color:#0A0E17;}
        .btn-3d{background:#7B61FF;color:white;}
        .btn-3d-meta{background:#7B61FF80;color:white;}
        .btn-danger{background:#FF375F;color:white;}
        .toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
        .btn{padding:10px 20px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.9rem;transition:all 0.2s;}
        .btn:hover{transform:translateY(-2px);}
        .btn-primary{background:linear-gradient(45deg,#00D4FF,#7B61FF);color:white;}
        .btn-secondary{background:#1A1F36;border:1px solid #00D4FF40;color:#00D4FF;}
        .btn-success{background:#00D4FF20;border:1px solid #00D4FF40;color:#00D4FF;}
        .search-input{padding:10px 15px;background:#1A1F36;border:1px solid #00D4FF40;border-radius:8px;color:#E0E0E0;font-size:0.9rem;width:250px;max-width:100%;flex:1 1 200px;}
        .search-input:focus{outline:none;border-color:#00D4FF;}
        .mensaje-flotante{position:fixed;bottom:20px;right:20px;background:#00D4FF;color:#0A0E17;padding:12px 20px;border-radius:8px;font-weight:bold;z-index:1000;animation:fadeOut 3s forwards;}
        @keyframes fadeOut{0%{opacity:1;}70%{opacity:1;}100%{opacity:0;}}
        .especies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px;}
        .especie-card{background:#1A1F36;border:2px solid #1A1F36;border-radius:10px;padding:15px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all 0.2s;}
        .especie-card:hover{border-color:#00D4FF80;}
        .especie-card.active{border-color:#00D4FF;background:linear-gradient(135deg,#00D4FF10,#7B61FF10);}
        @media(max-width:800px){.charts-grid{grid-template-columns:1fr;}}
        .table-wrap table{min-width:600px;}
        @media(max-width:480px){
            body{padding:10px;}
            h1{font-size:1.4rem;}
            .card,.stat-card{padding:15px;}
            .tab{padding:8px 12px;font-size:0.8rem;}
            th,td{padding:8px;font-size:0.75rem;}
            .search-input{width:100%;}
            .toolbar,.btn-group{gap:6px;}
            .btn{padding:8px 14px;font-size:0.85rem;}
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 Panel de Administración</h1>
    <div class="subtitle">Gestión de participantes y análisis de resultados — Clave Linepithema</div>

    <div class="tabs">
        <div class="tab active" data-tab="usuarios"    onclick="cambiarTab('usuarios')">👥 Usuarios</div>
        <div class="tab"        data-tab="especies"    onclick="cambiarTab('especies')">🔬 Especies</div>
        <div class="tab"        data-tab="estadisticas" onclick="cambiarTab('estadisticas')">📊 Estadísticas</div>
        <div class="tab"        data-tab="graficos"    onclick="cambiarTab('graficos')">📈 Gráficos</div>
        <div class="tab"        data-tab="analisis"    onclick="cambiarTab('analisis')">📉 Análisis</div>
        <div class="tab"        data-tab="detalles"    onclick="cambiarTab('detalles')">🔍 Resultados</div>
        <div class="tab"        data-tab="reflexiones" onclick="cambiarTab('reflexiones')">🧠 Reflexiones</div>
        <div class="tab"        data-tab="pines" onclick="cambiarTab('pines')">📍 Pines</div>
        <div class="tab"        data-tab="zoomcaracteres" onclick="cambiarTab('zoomcaracteres')">🔬 Zoom Caracteres</div>
    </div>

    <div class="toolbar">
        <button class="btn btn-primary"   onclick="exportarExcel()">📊 Excel</button>
        <button class="btn btn-secondary" onclick="exportarCSVServidor()">📥 CSV (servidor)</button>
        <button class="btn btn-secondary" onclick="exportarJSON()">📥 JSON</button>
        <button class="btn btn-secondary" onclick="window.location.href='/estadisticas'">📊 Estadísticas avanzadas</button>
        <button class="btn btn-secondary" onclick="window.open('/prueba-niveles-ayuda', '_blank')">🧪 Probar niveles de ayuda</button>
        <button class="btn btn-danger"    onclick="cerrarSesionAdmin()" style="background:#FF375F20;border:1px solid #FF375F40;color:#FF375F;">🔓 Cerrar sesión</button>
    </div>

    <div id="tabContent"></div>
</div>

<script>
    let usuarios = [], especiesConfig = { todas:[], activas:[] }, resultados = [], encuestas = [], reflexiones = [], pasos = [];

    document.addEventListener('DOMContentLoaded', () => {
        Promise.all([
            fetch('/api/admin/usuarios').then(r => r.json()),
            fetch('/api/admin/config/especies').then(r => r.json()),
            fetch('/api/admin/datos').then(r => r.json()),
            fetch('/api/admin/encuestas').then(r => r.json()),
            fetch('/api/admin/reflexiones').then(r => r.json()),
            fetch('/api/admin/pasos').then(r => r.json())
        ]).then(([u, e, r, ec, ref, ps]) => {
            usuarios = u; especiesConfig = e; resultados = r; encuestas = ec; reflexiones = ref; pasos = ps;
            cambiarTab('usuarios');
        }).catch(err => {
            document.getElementById('tabContent').innerHTML =
                '<div style="padding:40px;text-align:center;color:#FF375F;">❌ Error cargando datos. Verifica que estás autenticado.</div>';
        });
    });

    function mostrarMensaje(m, c='#00D4FF') {
        const d = document.createElement('div');
        d.className = 'mensaje-flotante';
        d.textContent = m;
        d.style.background = c;
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 3500);
    }

    function cambiarTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
        const acciones = {
            'usuarios':     mostrarUsuarios,
            'especies':     mostrarEspecies,
            'estadisticas': mostrarEstadisticas,
            'graficos':     mostrarGraficos,
            'analisis':     mostrarAnalisisEstadistico,
            'detalles':     mostrarResultadosDetallados,
            'reflexiones':  mostrarReflexiones,
            'pines':        mostrarCalibrarPines,
            'zoomcaracteres': mostrarZoomCaracteres
        };
        if (acciones[tab]) acciones[tab]();
    }

    // ===== USUARIOS =====
    function mostrarUsuarios() {
        const pendientes = usuarios.filter(u => !u.grupo_asignado).length;
        document.getElementById('tabContent').innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-number">${usuarios.length}</div><div class="stat-label">Total usuarios</div></div>
                <div class="stat-card"><div class="stat-number">${pendientes}</div><div class="stat-label">Sin grupo</div></div>
                <div class="stat-card"><div class="stat-number">${usuarios.length - pendientes}</div><div class="stat-label">Con grupo</div></div>
            </div>
            <div class="card">
                <div class="card-title">👥 Usuarios registrados</div>
                <div class="toolbar">
                    <input class="search-input" type="text" id="buscarUsuario" placeholder="🔍 Buscar por nombre o correo..." oninput="filtrarTabla()">
                    <button class="btn btn-success" onclick="asignarGrupoLote()">⚡ Asignar grupos automáticamente</button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr>
                            <th>ID</th><th>Usuario</th><th>Correo</th><th>Sem.</th><th>Curso</th>
                            <th>Exp.</th><th>Hab.Esp.</th><th>Género</th><th>Grupo</th><th>Acciones</th>
                        </tr></thead>
                        <tbody id="tbodyUsuarios"></tbody>
                    </table>
                </div>
            </div>`;
        renderTablaUsuarios(usuarios);
    }

    function renderTablaUsuarios(lista) {
        document.getElementById('tbodyUsuarios').innerHTML = lista.map(u => {
            const badgeClass = {'2D':'badge-2d','2D_META':'badge-2d-meta','3D':'badge-3d','3D_META':'badge-3d-meta'}[u.grupo_asignado] || 'badge-sin';
            const texto = u.grupo_asignado || 'Pendiente';
            const btns = !u.grupo_asignado
                ? `<div class="btn-group">
                    <button class="btn-sm btn-2d"      onclick="asignarGrupo(${u.id},'2D')">2D</button>
                    <button class="btn-sm btn-2d-meta" onclick="asignarGrupo(${u.id},'2D_META')">2D+M</button>
                    <button class="btn-sm btn-3d"      onclick="asignarGrupo(${u.id},'3D')">3D</button>
                    <button class="btn-sm btn-3d-meta" onclick="asignarGrupo(${u.id},'3D_META')">3D+M</button>
                    <button class="btn-sm" style="background:#7B61FF;color:white;" onclick="resetearPassword(${u.id})" title="Poner clave nueva">🔑</button>
                    <button class="btn-sm btn-danger"  onclick="eliminarUsuario(${u.id})">🗑️</button>
                   </div>`
                : `<div class="btn-group">
                    <button class="btn-sm" style="background:#7B61FF;color:white;" onclick="resetearPassword(${u.id})" title="Poner clave nueva">🔑</button>
                    <button class="btn-sm btn-danger" onclick="eliminarUsuario(${u.id})">🗑️</button>
                   </div>`;
            return `<tr>
                <td>${u.id}</td>
                <td><strong>${u.nombre_usuario}</strong></td>
                <td>${u.correo}</td>
                <td>${u.semestre || '—'}</td>
                <td>${u.curso || '—'}</td>
                <td>${u.experiencia_taxonomica ?? '—'}/5</td>
                <td>${u.habilidad_espacial ?? '—'}/20</td>
                <td>${u.genero || '—'}</td>
                <td><span class="badge ${badgeClass}">${texto}</span></td>
                <td>${btns}</td>
            </tr>`;
        }).join('');
    }

    function filtrarTabla() {
        const q = document.getElementById('buscarUsuario').value.toLowerCase();
        const filtrados = usuarios.filter(u =>
            u.nombre_usuario.toLowerCase().includes(q) ||
            u.correo.toLowerCase().includes(q)
        );
        renderTablaUsuarios(filtrados);
    }

    async function asignarGrupo(id, grupo) {
        if (!confirm(`¿Asignar al grupo ${grupo}?`)) return;
        const res = await fetch('/api/admin/asignar_grupo', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ usuario_id: id, grupo })
        });
        if (res.ok) {
            mostrarMensaje(`✅ Grupo ${grupo} asignado`);
            const u = usuarios.find(u => u.id === id);
            if (u) u.grupo_asignado = grupo;
            renderTablaUsuarios(usuarios);
        } else {
            mostrarMensaje('❌ Error al asignar grupo', '#FF375F');
        }
    }

    async function asignarGrupoLote() {
        const pendientes = usuarios.filter(u => !u.grupo_asignado).length;
        if (pendientes === 0) { mostrarMensaje('ℹ️ Todos los usuarios ya tienen grupo asignado'); return; }
        if (!confirm(`¿Asignar grupos en rotación automática a ${pendientes} usuarios sin grupo?`)) return;
        const res = await fetch('/api/admin/asignar_grupo_lote', { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
            mostrarMensaje(`✅ ${data.mensaje}`);
            // Recargar usuarios
            const u = await fetch('/api/admin/usuarios').then(r => r.json());
            usuarios = u;
            mostrarUsuarios();
        } else {
            mostrarMensaje('❌ Error en asignación', '#FF375F');
        }
    }

    async function eliminarUsuario(id) {
        const u = usuarios.find(u => u.id === id);
        if (!confirm(`¿Eliminar a "${u?.nombre_usuario}"? Se perderán TODOS sus datos.`)) return;
        const res = await fetch(`/api/admin/usuarios/${id}`, { method: 'DELETE' });
        if (res.ok) {
            mostrarMensaje('✅ Usuario eliminado');
            usuarios = usuarios.filter(u => u.id !== id);
            renderTablaUsuarios(usuarios);
        } else {
            mostrarMensaje('❌ Error al eliminar', '#FF375F');
        }
    }

    async function resetearPassword(id) {
        const u = usuarios.find(u => u.id === id);
        const nueva = prompt(`Nueva contraseña temporal para "${u?.nombre_usuario}" (mínimo 4 caracteres):`);
        if (!nueva) return;
        if (nueva.trim().length < 4) {
            mostrarMensaje('❌ La contraseña debe tener al menos 4 caracteres', '#FF375F');
            return;
        }
        const res = await fetch(`/api/admin/usuarios/${id}/resetear_password`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ nueva_password: nueva.trim() })
        });
        if (res.ok) {
            mostrarMensaje(`✅ Contraseña de ${u?.nombre_usuario} actualizada. Comunícasela por tu cuenta.`);
        } else {
            const data = await res.json().catch(()=>({}));
            mostrarMensaje(`❌ ${data.error || 'Error al resetear contraseña'}`, '#FF375F');
        }
    }

    // ===== ESPECIES =====
    function mostrarEspecies() {
        document.getElementById('tabContent').innerHTML = `
            <div class="card">
                <div class="card-title">🔬 Especies activas en el experimento</div>
                <div id="especiesGrid" class="especies-grid"></div>
                <div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;">
                    <button class="btn btn-primary"   onclick="guardarEspecies()">💾 Guardar</button>
                    <button class="btn btn-secondary" onclick="seleccionarTodas()">✅ Todas</button>
                    <button class="btn btn-secondary" onclick="deseleccionarTodas()">❌ Ninguna</button>
                </div>
                <p style="color:#A0A0B0;font-size:0.85rem;margin-top:12px;">Las especies activas son las que se asignarán al azar a los estudiantes en el experimento.</p>
            </div>`;
        renderEspeciesConfig();
    }

    function toggleEspecie(id) {
        if (especiesConfig.activas.includes(id))
            especiesConfig.activas = especiesConfig.activas.filter(i => i !== id);
        else
            especiesConfig.activas.push(id);
        renderEspeciesConfig();
    }

    function renderEspeciesConfig() {
        const grid = document.getElementById('especiesGrid');
        if (!grid) return;
        grid.innerHTML = especiesConfig.todas.map(esp => {
            const act = especiesConfig.activas.includes(esp.id);
            return `<div class="especie-card ${act?'active':''}" onclick="toggleEspecie('${esp.id}')">
                <input type="checkbox" ${act?'checked':''} style="accent-color:#00D4FF;" onclick="event.stopPropagation();toggleEspecie('${esp.id}')">
                <div><strong>${esp.nombre}</strong><br><span style="color:#A0A0B0;font-size:0.8rem;">${esp.id}</span></div>
            </div>`;
        }).join('');
    }

    function seleccionarTodas()   { especiesConfig.activas = especiesConfig.todas.map(e=>e.id); renderEspeciesConfig(); }
    function deseleccionarTodas() { especiesConfig.activas = []; renderEspeciesConfig(); }
    async function guardarEspecies() {
        const res = await fetch('/api/admin/config/especies', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ activas: especiesConfig.activas })
        });
        mostrarMensaje(res.ok ? '✅ Configuración guardada' : '❌ Error al guardar', res.ok ? '#00D4FF' : '#FF375F');
    }

    // ===== ESTADÍSTICAS =====
    function mostrarEstadisticas() {
        const grupos = ['2D','2D_META','3D','3D_META'];
        const total  = resultados.length;
        const aciertos = resultados.filter(r=>r.acerto).length;
        const precision = total > 0 ? Math.round((aciertos/total)*100) : 0;
        const tiempoProm = total > 0 ? Math.round(resultados.reduce((s,r)=>s+(r.tiempo||0),0)/total) : 0;

        const filas = grupos.map(g => {
            const rg = resultados.filter(r=>r.grupo===g);
            const ag = rg.filter(r=>r.acerto).length;
            const pg = rg.length > 0 ? Math.round((ag/rg.length)*100) : 0;
            const tg = rg.length > 0 ? Math.round(rg.reduce((s,r)=>s+(r.tiempo||0),0)/rg.length) : 0;
            const eg = encuestas.filter(e=>e.grupo===g&&e.tipo==='SUS');
            const sg = eg.length > 0 ? Math.round(eg.reduce((s,e)=>s+(e.puntaje_total||0),0)/eg.length) : '—';
            const ug = usuarios.filter(u=>u.grupo_asignado===g).length;
            return `<tr><td><strong>${g}</strong></td><td>${ug}</td><td>${rg.length}</td><td>${pg}%</td><td>${tg}s</td><td>${sg}${sg!=='—'?'/100':''}</td></tr>`;
        }).join('');

        document.getElementById('tabContent').innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-number">${usuarios.length}</div><div class="stat-label">Usuarios</div></div>
                <div class="stat-card"><div class="stat-number">${total}</div><div class="stat-label">Identificaciones</div></div>
                <div class="stat-card"><div class="stat-number">${precision}%</div><div class="stat-label">Precisión global</div></div>
                <div class="stat-card"><div class="stat-number">${tiempoProm}s</div><div class="stat-label">Tiempo promedio</div></div>
            </div>
            <div class="card">
                <div class="card-title">📊 Resultados por grupo</div>
                <div class="table-wrap">
                    <table><thead><tr><th>Grupo</th><th>N</th><th>Identif.</th><th>Precisión</th><th>Tiempo prom.</th><th>SUS prom.</th></tr></thead>
                    <tbody>${filas}</tbody></table>
                </div>
            </div>`;
    }

    // ===== GRÁFICOS =====
    function mostrarGraficos() {
        const grupos = ['2D','2D_META','3D','3D_META'];
        const labels = ['2D','2D+Meta','3D','3D+Meta'];
        const colores = ['#00D4FF','#00D4FF80','#7B61FF','#7B61FF80'];

        const precision = grupos.map(g=>{ const r=resultados.filter(r=>r.grupo===g); return r.length?Math.round(r.filter(r=>r.acerto).length/r.length*100):0; });
        const tiempo    = grupos.map(g=>{ const r=resultados.filter(r=>r.grupo===g); return r.length?Math.round(r.reduce((s,r)=>s+(r.tiempo||0),0)/r.length):0; });
        const sus       = grupos.map(g=>{ const e=encuestas.filter(e=>e.grupo===g&&e.tipo==='SUS'); return e.length?Math.round(e.reduce((s,e)=>s+(e.puntaje_total||0),0)/e.length):0; });

        document.getElementById('tabContent').innerHTML = `
            <div class="charts-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;">
                <div style="background:#1A1F36;border-radius:15px;padding:20px;"><div class="card-title">📊 Precisión por grupo</div><canvas id="chPrecision"></canvas></div>
                <div style="background:#1A1F36;border-radius:15px;padding:20px;"><div class="card-title">⏱️ Tiempo promedio (s)</div><canvas id="chTiempo"></canvas></div>
                <div style="background:#1A1F36;border-radius:15px;padding:20px;"><div class="card-title">📋 Puntaje SUS</div><canvas id="chSUS"></canvas></div>
                <div style="background:#1A1F36;border-radius:15px;padding:20px;"><div class="card-title">🥧 Distribución aciertos</div><canvas id="chDist"></canvas></div>
            </div>`;
        setTimeout(() => {
            const opts = (max) => ({ responsive:true, plugins:{legend:{labels:{color:'#E0E0E0'}}}, scales:{y:{beginAtZero:true, max, ticks:{color:'#A0A0B0'}}, x:{ticks:{color:'#A0A0B0'}}}});
            new Chart(document.getElementById('chPrecision'), { type:'bar', data:{ labels, datasets:[{ label:'Precisión (%)', data:precision, backgroundColor:colores, borderRadius:8 }] }, options:opts(100) });
            new Chart(document.getElementById('chTiempo'),    { type:'bar', data:{ labels, datasets:[{ label:'Tiempo (s)',    data:tiempo,    backgroundColor:colores, borderRadius:8 }] }, options:opts(null) });

    // ===== ANÁLISIS =====
    function mostrarAnalisisEstadistico() {
        const g2d = resultados.filter(r=>r.grupo==='2D'||r.grupo==='2D_META');
        const g3d = resultados.filter(r=>r.grupo==='3D'||r.grupo==='3D_META');
        const ac2d = g2d.filter(r=>r.acerto).length;
        const ac3d = g3d.filter(r=>r.acerto).length;
        const p2d = g2d.length > 0 ? (ac2d/g2d.length*100).toFixed(1) : 0;
        const p3d = g3d.length > 0 ? (ac3d/g3d.length*100).toFixed(1) : 0;
        const t2d = g2d.length > 0 ? (g2d.reduce((s,r)=>s+(r.tiempo||0),0)/g2d.length).toFixed(1) : 0;
        const t3d = g3d.length > 0 ? (g3d.reduce((s,r)=>s+(r.tiempo||0),0)/g3d.length).toFixed(1) : 0;
        const diffP = (p3d - p2d).toFixed(1);
        const diffT = t2d > 0 ? ((t2d - t3d)/t2d*100).toFixed(1) : 0;

        document.getElementById('tabContent').innerHTML = `
            <div class="card">
                <div class="card-title">📊 Análisis 2D vs 3D</div>
                <div class="table-wrap">
                    <table><thead><tr><th>Indicador</th><th>Grupo 2D (n=${g2d.length})</th><th>Grupo 3D (n=${g3d.length})</th><th>Diferencia</th></tr></thead>
                    <tbody>
                        <tr><td><strong>✅ Precisión</strong></td><td>${p2d}%</td><td>${p3d}%</td><td style="color:${diffP>=0?'#00D4FF':'#FF375F'}">${diffP>=0?'+':''}${diffP}%</td></tr>
                        <tr><td><strong>⏱️ Tiempo prom.</strong></td><td>${t2d}s</td><td>${t3d}s</td><td style="color:${diffT>=0?'#00D4FF':'#FF375F'}">${diffT>=0?'-':'+'}${Math.abs(diffT)}%</td></tr>
                    </tbody></table>
                </div>
                <div style="margin-top:20px;padding:15px;background:#1A1F36;border-radius:10px;">
                    <p>📊 <strong>Precisión:</strong> El grupo 3D obtuvo <strong>${p3d}%</strong> de aciertos vs <strong>${p2d}%</strong> del grupo 2D (<strong>${Math.abs(diffP)} puntos</strong> de diferencia).</p>
                    <p style="margin-top:8px;">⏱️ <strong>Tiempo:</strong> El grupo 3D fue un <strong>${diffT}%</strong> ${diffT>=0?'más rápido':'más lento'} que el grupo 2D.</p>
                    <p style="margin-top:8px;">${Math.abs(diffP)>5?'✅ Diferencia relevante, pendiente prueba estadística con muestra completa.':'⚠️ Se necesita una muestra mayor para confirmar significancia estadística.'}</p>
                </div>
            </div>`;
    }

    function renderReflexionesFiltradas() {
        const grupoSel = document.getElementById('filtroGrupoReflexiones')?.value || '';
        const usuarioSel = document.getElementById('filtroUsuarioReflexiones')?.value || '';

        const reflexionesF = reflexiones.filter(r =>
            (!grupoSel || r.grupo === grupoSel) && (!usuarioSel || r.usuario === usuarioSel)
        );
        const pasosF = pasos.filter(p =>
            (!grupoSel || p.grupo === grupoSel) && (!usuarioSel || p.usuario === usuarioSel)
        );

        // ----- Bloque de reflexiones metacognitivas (pre/durante/post) -----
        const filasReflexiones = reflexionesF.map(r=>`
            <tr>
                <td>${r.usuario}</td><td>${r.grupo}</td><td>${r.momento||'—'}</td>
                <td style="max-width:300px;font-size:0.82rem;">${(r.respuesta_raw||'').substring(0,120)}${(r.respuesta_raw||'').length>120?'…':''}</td>
            </tr>`).join('');

        // ----- Bloque de recorrido paso a paso por la clave -----
        // Agrupar por usuario + especimen para armar el recorrido completo
        const grupos_pasos = {};
        pasosF.forEach(p => {
            const key = `${p.usuario}||${p.sesion_id}||${p.especimen_id}`;
            if (!grupos_pasos[key]) grupos_pasos[key] = { usuario:p.usuario, grupo:p.grupo, especimen_id:p.especimen_id, pasos:[] };
            grupos_pasos[key].pasos.push(p);
        });

        const bloquesRecorrido = Object.values(grupos_pasos).map(g => {
            g.pasos.sort((a,b)=>a.orden_paso - b.orden_paso);
            const tiempoTotal = g.pasos.reduce((s,p)=>s+(p.tiempo_segundos||0),0);
            const pasosRapidos = g.pasos.filter(p=>p.tiempo_segundos < 2).length;
            const ultimoPaso = g.pasos[g.pasos.length-1];
            const conclusionOk = ultimoPaso ? ultimoPaso.es_paso_correcto : null;
            const alertaConciencia = pasosRapidos >= Math.ceil(g.pasos.length/2)
                ? '<span style="color:#FFB020;" title="La mitad o más de sus respuestas tomaron menos de 2s">⚡ Posible clic sin leer</span>'
                : '<span style="color:#00D4FF;">✓ Ritmo razonable</span>';

            const filasPaso = g.pasos.map(p => `
                <tr>
                    <td>Pregunta ${p.pregunta}</td>
                    <td>Opción ${p.opcion_elegida===0?'A':'B'}</td>
                    <td style="color:${p.es_paso_correcto?'#00D4FF':'#FF375F'};">${p.es_paso_correcto?'✅':'❌ se desvió aquí'}</td>
                    <td>${(p.tiempo_segundos||0).toFixed(1)}s ${p.tiempo_segundos<2?'⚡':''}</td>
                </tr>`).join('');

            return `<div class="stat-card" style="margin-bottom:12px;text-align:left;">
                <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
                    <strong style="color:#00D4FF;">${g.usuario}</strong>
                    <span class="badge">${g.grupo||'—'}</span>
                    <span style="color:#A0A0B0;">Espécimen: ${g.especimen_id}</span>
                    <span>Tiempo total: <strong>${tiempoTotal.toFixed(1)}s</strong></span>
                    ${alertaConciencia}
                </div>
                <table style="width:100%;font-size:0.85rem;">
                    <thead><tr style="color:#00D4FF;"><th style="text-align:left;">Paso</th><th style="text-align:left;">Eligió</th><th style="text-align:left;">Resultado</th><th style="text-align:left;">Tiempo</th></tr></thead>
                    <tbody>${filasPaso}</tbody>
                </table>
            </div>`;
        }).join('');

        document.getElementById('contenidoReflexionesFiltradas').innerHTML = `
            <div class="card-title" style="font-size:1rem;margin-top:10px;">🧭 Recorrido detallado por la clave (${Object.keys(grupos_pasos).length} espécimen(es))</div>
            ${bloquesRecorrido || '<div style="text-align:center;padding:20px;color:#A0A0B0;">Sin recorridos registrados con este filtro.</div>'}

            <div class="card-title" style="font-size:1rem;margin-top:25px;">💭 Reflexiones metacognitivas (${reflexionesF.length})</div>
            <div class="table-wrap">
                <table><thead><tr><th>Usuario</th><th>Grupo</th><th>Momento</th><th>Respuesta</th></tr></thead>
                <tbody>${filasReflexiones || '<tr><td colspan="4" style="text-align:center;padding:20px;">Sin reflexiones con este filtro.</td></tr>'}</tbody></table>
            </div>`;
    }

    function exportarPasosCSV() {
        let csv = 'Usuario,Grupo,Sesion,Especimen,Pregunta,OpcionElegida,PasoCorrecto,PasoFinal,TiempoSegundos,OrdenPaso\n';
        pasos.forEach(p => {
            csv += `"${p.usuario}","${p.grupo}",${p.sesion_id},"${p.especimen_id}",${p.pregunta},${p.opcion_elegida===0?'A':'B'},${p.es_paso_correcto},${p.es_paso_final},${p.tiempo_segundos},${p.orden_paso}\n`;
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' }));
        a.download = `recorrido_detallado_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);

                background:rgba(0,212,255,0.9);border:2px solid white;transform:translate(-50%,-50%);
                cursor:grab;display:flex;align-items:center;justify-content:center;z-index:10;
                box-shadow:0 2px 8px rgba(0,0,0,0.5);font-size:11px;font-weight:bold;color:#0A0E17;
                left:${coords.px}%; top:${coords.py}%;`;
            pin.textContent = i + 1;
            pin.title = p.label;
            pin.dataset.id = p.id;

            pin.addEventListener('mousedown', (e) => {
                pinArrastrando = p.id;
                pin.style.cursor = 'grabbing';
                e.preventDefault();
            });
            pin.addEventListener('touchstart', (e) => {
                pinArrastrando = p.id;
                e.preventDefault();
            }, { passive: false });

            overlay.appendChild(pin);
        });

        const contenedor = document.getElementById('calibradorContainer');
        contenedor.onmousemove = (e) => moverPinArrastrado(e.clientX, e.clientY);
        contenedor.onmouseup = () => { pinArrastrando = null; };
        contenedor.onmouseleave = () => { pinArrastrando = null; };
        contenedor.ontouchmove = (e) => {
            if (pinArrastrando && e.touches[0]) {
                moverPinArrastrado(e.touches[0].clientX, e.touches[0].clientY);
                e.preventDefault();
            }
        };
        contenedor.ontouchend = () => { pinArrastrando = null; };

        document.getElementById('calibradorLeyenda').innerHTML =
            PARTES_HORMIGA_DEFAULT.map((p, i) => `<span style="margin-right:12px;">${i+1}. ${p.label}</span>`).join('');
    }

    function moverPinArrastrado(clientX, clientY) {
        if (!pinArrastrando) return;
        const img = document.getElementById('calibradorImg');
        const rect = img.getBoundingClientRect();
        let px = ((clientX - rect.left) / rect.width) * 100;
        let py = ((clientY - rect.top) / rect.height) * 100;
        px = Math.max(0, Math.min(100, px));
        py = Math.max(0, Math.min(100, py));
        posicionesPinesEdicion[pinArrastrando] = { px: Math.round(px * 10) / 10, py: Math.round(py * 10) / 10 };
        renderPinesCalibrador();
    }

    async function guardarPosicionesPines() {
        const res = await fetch('/api/admin/config/pines', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ posiciones: posicionesPinesEdicion })
        });
        if (res.ok) {
            mostrarMensaje('✅ Posiciones guardadas. Ya se aplican en las 4 claves.');
        } else {
            mostrarMensaje('❌ Error al guardar posiciones', '#FF375F');
        }
    }

    function restablecerPosicionesPines() {
        if (!confirm('¿Restablecer todos los pines a su posición original? (no se guarda hasta que le des "Guardar posiciones")')) return;
        PARTES_HORMIGA_DEFAULT.forEach(p => {
            posicionesPinesEdicion[p.id] = { px: p.px, py: p.py };
        });
        renderPinesCalibrador();
    }

    // ===== EXPORTAR =====
    function exportarCSVServidor() {
        window.open('/api/admin/exportar_csv', '_blank');
        mostrarMensaje('✅ Descargando CSV desde servidor');
    }

    function exportarJSON() {
        const blob = new Blob([JSON.stringify({ usuarios, resultados, encuestas, reflexiones }, null, 2)], { type:'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `datos_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
        mostrarMensaje('✅ JSON exportado');
    }

    function exportarExcel() {
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
            usuarios.map(u=>({ ID:u.id, Usuario:u.nombre_usuario, Correo:u.correo, Grupo:u.grupo_asignado||'Sin asignar', Semestre:u.semestre, Curso:u.curso }))
        ), 'Usuarios');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
            resultados.map(r=>({ Usuario:r.usuario, Grupo:r.grupo, Especimen:r.especimen||'', Correcta:r.correcta||'', Seleccionada:r.seleccionada||'', Resultado:r.acerto?'Correcto':'Incorrecto', Tiempo:r.tiempo||0 }))
        ), 'Resultados');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
            encuestas.map(e=>({ Sesion:e.sesion_id, Grupo:e.grupo||'', Tipo:e.tipo, Puntaje:e.puntaje_total||'' }))
        ), 'Encuestas');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
            reflexiones.map(r=>({ Usuario:r.usuario, Grupo:r.grupo, Momento:r.momento, Respuesta:r.respuesta_raw }))
        ), 'Reflexiones');
        XLSX.writeFile(wb, `datos_${new Date().toISOString().split('T')[0]}.xlsx`);
        mostrarMensaje('✅ Excel exportado');
    }

    function exportarReflexionesCSV() {
        let csv = 'Usuario,Grupo,Momento,Pregunta,Respuesta\n';
        reflexiones.forEach(r => {
            csv += `"${r.usuario}","${r.grupo}","${r.momento}","${(r.pregunta||'').replace(/"/g,'""')}","${(r.respuesta_raw||'').replace(/"/g,'""')}"\n`;
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' }));
        a.download = `reflexiones_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
        mostrarMensaje('✅ Reflexiones exportadas');
    }

    async function cerrarSesionAdmin() {
        if (!confirm('¿Cerrar sesión del panel de administración?')) return;
        await fetch('/api/admin/logout', { method:'POST' });
        window.location.href = '/admin';
    }
</script>
