<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas Avanzadas - Clave Linepithema</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0A0E17; color: #E0E0E0; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { background: linear-gradient(45deg, #00D4FF, #7B61FF); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .subtitle { color: #A0A0B0; margin-bottom: 30px; border-bottom: 1px solid #00D4FF30; padding-bottom: 10px; }
        .section { background: #121826; border: 1px solid #00D4FF40; border-radius: 15px; padding: 25px; margin-bottom: 30px; }
        .section-title { color: #00D4FF; font-size: 1.3rem; margin-bottom: 20px; border-bottom: 1px solid #00D4FF30; padding-bottom: 10px; }
        .subsection-title { color: #7B61FF; font-size: 1.1rem; margin: 15px 0 10px 0; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; background: #1A1F36; border-radius: 10px; overflow: hidden; }
        th { background: #1A1F36; color: #00D4FF; padding: 12px; text-align: left; border-bottom: 1px solid #00D4FF40; }
        td { padding: 10px 12px; border-bottom: 1px solid #1A1F36; }
        .stat-card { background: #1A1F36; border-radius: 10px; padding: 15px; margin: 10px 0; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin: 15px 0; }
        .stat-number { font-size: 2rem; font-weight: bold; color: #00D4FF; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: linear-gradient(45deg, #00D4FF, #7B61FF); color: white; }
        .btn-secondary { background: #1A1F36; border: 1px solid #00D4FF40; color: #00D4FF; }
        .btn:hover { transform: translateY(-2px); }
        .flex-buttons { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .badge-correcto { color: #00D4FF; font-weight: bold; }
        .badge-incorrecto { color: #FF375F; font-weight: bold; }
        .chart-container { background: #1A1F36; border-radius: 15px; padding: 20px; margin: 20px 0; }
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 25px; margin-bottom: 30px; }
        canvas { max-height: 350px; width: 100%; }
        .mensaje-flotante { position: fixed; bottom: 20px; right: 20px; background: #00D4FF; color: #0A0E17; padding: 12px 20px; border-radius: 8px; z-index: 1000; animation: fadeOut 3s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; display: none; } }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 Estadísticas Avanzadas</h1>
    <div class="subtitle">Análisis estadístico completo del estudio</div>
    
    <div class="flex-buttons">
        <button class="btn btn-primary" onclick="exportarResultados()">📥 Exportar todos los resultados (JSON)</button>
        <button class="btn btn-secondary" onclick="window.location.href='/admin'">← Volver al Admin</button>
    </div>
    
    <div id="contenidoEstadisticas"></div>
</div>

<script>
    let usuarios = [], resultados = [], encuestas = [], reflexiones = [];
    
    document.addEventListener('DOMContentLoaded', async () => {
        await cargarDatos();
        await generarTodasEstadisticas();
    });

    async function cargarDatos() {
        try {
            const [usuariosRes, resultadosRes, encuestasRes, reflexionesRes] = await Promise.all([
                fetch('/api/admin/usuarios').then(r => r.json()),
                fetch('/api/admin/datos').then(r => r.json()),
                fetch('/api/admin/encuestas').then(r => r.json()),
                fetch('/api/admin/reflexiones').then(r => r.json())
            ]);
            usuarios = usuariosRes;
            resultados = resultadosRes;
            encuestas = encuestasRes;
            reflexiones = reflexionesRes;
            console.log("✅ Datos cargados:", { usuarios: usuarios.length, resultados: resultados.length });
        } catch(e) { console.error("Error cargando datos:", e); }
    }

    function exportarResultados() {
        const datos = { usuarios, resultados, encuestas, reflexiones };
        const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `estadisticas_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
        mostrarMensaje('✅ Datos exportados', '#00D4FF');
    }

    function mostrarMensaje(m, c) {
        let d = document.createElement('div'); d.className = 'mensaje-flotante'; d.textContent = m; d.style.background = c;
        document.body.appendChild(d); setTimeout(() => d.remove(), 3000);
    }

    async function generarTodasEstadisticas() {
        document.getElementById('contenidoEstadisticas').innerHTML = '<div style="text-align:center; padding:50px;">📊 Procesando datos...</div>';
        
        let html = '';
        html += generarResumenDescriptivo();
        html += generarGraficosPrincipales();
        html += generarCargasCognitivas();
        html += generarCorrelacionConfianza();
        html += generarEvolucionPrecision();
        html += generarTablaParticipantes();  // ← TABLA AGREGADA
        
        document.getElementById('contenidoEstadisticas').innerHTML = html;
        await dibujarTodosLosGraficos();
    }

    function generarResumenDescriptivo() {
        const grupos = ['2D', '2D_META', '3D', '3D_META'];
        const gruposNombres = ['2D', '2D+Meta', '3D', '3D+Meta'];
        let stats = {};
        grupos.forEach(g => {
            const usuariosGrupo = usuarios.filter(u => u.grupo_asignado === g);
            const resultadosGrupo = resultados.filter(r => r.grupo === g);
            const encuestasGrupo = encuestas.filter(e => e.grupo === g && e.tipo === 'SUS');
            const aciertos = resultadosGrupo.filter(r => r.acerto).length;
            const precision = resultadosGrupo.length > 0 ? (aciertos / resultadosGrupo.length * 100).toFixed(1) : 0;
            const tiempoProm = resultadosGrupo.length > 0 ? (resultadosGrupo.reduce((s,r) => s + (r.tiempo || 0), 0) / resultadosGrupo.length).toFixed(1) : 0;
            const susProm = encuestasGrupo.length > 0 ? (encuestasGrupo.reduce((s,e) => s + (e.puntaje_total || 0), 0) / encuestasGrupo.length).toFixed(1) : 0;
            stats[g] = { n: usuariosGrupo.length, precision, tiempo: tiempoProm, sus: susProm };
        });
        
        return `<div class="section">
            <div class="section-title">📈 1. Resumen Descriptivo por Grupo</div>
            <div class="stats-grid">${grupos.map((g, i) => `<div class="stat-card"><div class="stat-number">${stats[g].n}</div><div class="stat-label">${gruposNombres[i]}</div></div>`).join('')}</div>
            <div class="table-container"><table><thead><tr><th>Grupo</th><th>n</th><th>Precisión (%)</th><th>Tiempo (s)</th><th>SUS</th></tr></thead><tbody>
            ${grupos.map((g, i) => `<tr>:<strong>${gruposNombres[i]}</strong> jon}.${stats[g].n}</td><td class="${stats[g].precision >= 70 ? 'badge-correcto' : ''}">${stats[g].precision}%</td>${stats[g].tiempo}s</td>${stats[g].sus}</tr>`).join('')}
            </tbody></table></div></div>`;
    }

    function generarGraficosPrincipales() {
        const grupos = ['2D', '2D_META', '3D', '3D_META'];
        const precisionData = grupos.map(g => {
            const r = resultados.filter(r => r.grupo === g);
            const a = r.filter(r => r.acerto).length;
            return r.length ? (a / r.length * 100).toFixed(1) : 0;
        });
        const tiempoData = grupos.map(g => {
            const r = resultados.filter(r => r.grupo === g);
            return r.length ? (r.reduce((s,rr) => s + (rr.tiempo || 0), 0) / r.length).toFixed(1) : 0;
        });
        const susData = grupos.map(g => {
            const e = encuestas.filter(e => e.grupo === g && e.tipo === 'SUS');
            return e.length ? (e.reduce((s,ee) => s + (ee.puntaje_total || 0), 0) / e.length).toFixed(1) : 0;
        });
        
        window.precisionData = precisionData;
        window.tiempoData = tiempoData;
        window.susData = susData;
        window.grupos = grupos;
        
        return `<div class="section">
            <div class="section-title">📊 2. Gráficos Principales</div>
            <div class="charts-grid">
                <div class="chart-container"><canvas id="chartPrecision"></canvas><div style="text-align:center; margin-top:10px;">Precisión por grupo</div></div>
                <div class="chart-container"><canvas id="chartTiempo"></canvas><div style="text-align:center; margin-top:10px;">Tiempo promedio por grupo (s)</div></div>
                <div class="chart-container"><canvas id="chartSUS"></canvas><div style="text-align:center; margin-top:10px;">Puntaje SUS por grupo</div></div>
                <div class="chart-container"><canvas id="chartDoughnut"></canvas><div style="text-align:center; margin-top:10px;">Distribución de aciertos</div></div>
            </div>
        </div>`;
    }

    function generarCargasCognitivas() {
        const grupos = ['2D', '2D_META', '3D', '3D_META'];
        let medias = { intrínseca: {}, extrínseca: {}, germana: {} };
        let conteos = {};
        grupos.forEach(g => { medias.intrínseca[g] = 0; medias.extrínseca[g] = 0; medias.germana[g] = 0; conteos[g] = 0; });
        
        encuestas.forEach(e => {
            if (e.tipo === 'COGNITIVE_LOAD' && e.grupo) {
                let intrin = e.carga_intrinseca || 0;
                let extrin = e.carga_extrinseca || 0;
                let germ = e.carga_germana || 0;
                if (intrin > 0 && extrin > 0) {
                    medias.intrínseca[e.grupo] += intrin;
                    medias.extrínseca[e.grupo] += extrin;
                    medias.germana[e.grupo] += germ;
                    conteos[e.grupo]++;
                }
            }
        });
        
        grupos.forEach(g => {
            if (conteos[g] > 0) {
                medias.intrínseca[g] = (medias.intrínseca[g] / conteos[g]).toFixed(1);
                medias.extrínseca[g] = (medias.extrínseca[g] / conteos[g]).toFixed(1);
                medias.germana[g] = (medias.germana[g] / conteos[g]).toFixed(1);
            } else { medias.intrínseca[g] = 0; medias.extrínseca[g] = 0; medias.germana[g] = 0; }
        });
        
        window.cargasData = {
            labels: grupos,
            intrínseca: grupos.map(g => parseFloat(medias.intrínseca[g])),
            extrínseca: grupos.map(g => parseFloat(medias.extrínseca[g])),
            germana: grupos.map(g => parseFloat(medias.germana[g]))
        };
        
        return `<div class="section">
            <div class="section-title">🧠 3. Cargas Cognitivas por Grupo</div>
            <div class="chart-container"><canvas id="chartCargas"></canvas></div>
            <div class="table-container">\n<table>\n<thead>\n<tr>\n<th>Grupo</th>\n<th>Carga Intrínseca</th>\n<th>Carga Extrínseca</th>\n<th>Carga Germana</th>\n</tr>\n</thead>\n<tbody>
            ${grupos.map(g => `<tr>\n<td><strong>${g}</strong></td>\n<td>${medias.intrínseca[g]}</td>\n<td>${medias.extrínseca[g]}</td>\n<td>${medias.germana[g]}</td>\n</tr>`).join('')}
            </tbody>\n</table>\n</div></div>`;
    }

    function generarCorrelacionConfianza() {
        let puntos = [];
        reflexiones.filter(r => r.momento === 'durante').forEach(r => {
            let match = r.respuesta_raw.match(/Seguridad: (\d+)%/);
            if (match && r.usuario) {
                let resultadosUser = resultados.filter(res => res.usuario === r.usuario);
                let aciertos = resultadosUser.filter(res => res.acerto).length;
                let total = resultadosUser.length;
                let precision = total > 0 ? (aciertos / total) * 100 : 0;
                puntos.push({ confianza: parseInt(match[1]), precision });
            }
        });
        window.correlacionPuntos = puntos;
        
        return `<div class="section">
            <div class="section-title">📈 4. Correlación: Confianza vs Precisión</div>
            <div class="chart-container"><canvas id="chartCorrelacion"></canvas></div>
            <div class="stat-card">📊 r de Pearson calculado en tiempo real</div>
        </div>`;
    }

    function generarEvolucionPrecision() {
        const grupos = ['2D', '2D_META', '3D', '3D_META'];
        let aciertos1 = [0,0,0,0], totales1 = [0,0,0,0], aciertos2 = [0,0,0,0], totales2 = [0,0,0,0];
        
        resultados.forEach(r => {
            let idx = grupos.indexOf(r.grupo);
            if (idx !== -1) {
                if (r.orden === 1) { if (r.acerto) aciertos1[idx]++; totales1[idx]++; }
                else if (r.orden === 2) { if (r.acerto) aciertos2[idx]++; totales2[idx]++; }
            }
        });
        
        let precision1 = grupos.map((_,i) => totales1[i] ? (aciertos1[i]/totales1[i]*100).toFixed(1) : 0);
        let precision2 = grupos.map((_,i) => totales2[i] ? (aciertos2[i]/totales2[i]*100).toFixed(1) : 0);
        
        window.evolucionData = { labels: grupos, precision1, precision2 };
        
        return `<div class="section">
            <div class="section-title">📈 5. Evolución de la Precisión (Espécimen 1 vs 2)</div>
            <div class="chart-container"><canvas id="chartEvolucion"></canvas></div>
        </div>`;
    }

    // ========== NUEVA FUNCIÓN: TABLA DE PARTICIPANTES ==========
    function generarTablaParticipantes() {
        let html = '<div class="section">';
        html += '<div class="section-title">👥 6. Datos por Participante</div>';
        html += '<div style="overflow-x: auto;">';
        html += '<table style="width:100%; border-collapse:collapse;">';
        html += '<thead><tr style="background:#00D4FF; color:#0A0E17;"><th style="padding:10px;">Usuario</th><th style="padding:10px;">Grupo</th><th style="padding:10px;">Identificaciones</th><th style="padding:10px;">Aciertos</th><th style="padding:10px;">Precisión %</th><th style="padding:10px;">Tiempo (s)</th></tr></thead><tbody>';
        
        usuarios.forEach(u => {
            let resultadosUser = resultados.filter(r => r.usuario === u.usuario);
            let total = resultadosUser.length;
            let aciertos = resultadosUser.filter(r => r.acerto).length;
            let precision = total > 0 ? (aciertos / total * 100).toFixed(1) : 0;
            let tiempoTotal = resultadosUser.reduce((sum, r) => sum + (r.tiempo || 0), 0);
            
            html += `<tr style="border-bottom:1px solid #1A1F36;">`;
            html += `<td style="padding:10px;">${u.usuario}</td>`;
            html += `<td style="padding:10px;">${u.grupo_asignado || u.grupo || '-'}</td>`;
            html += `<td style="padding:10px;">${total}</td>`;
            html += `<td style="padding:10px;">${aciertos}</td>`;
            html += `<td style="padding:10px;" class="${precision >= 70 ? 'badge-correcto' : ''}">${precision}%</td>`;
            html += `<td style="padding:10px;">${tiempoTotal.toFixed(1)}s</td>`;
            html += `</tr>`;
        });
        
        html += '</tbody></table></div></div>';
        return html;
    }

    async function dibujarTodosLosGraficos() {
        // Gráfico 1: Precisión
        if (document.getElementById('chartPrecision') && window.precisionData) {
            new Chart(document.getElementById('chartPrecision'), {
                type: 'bar', data: { labels: window.grupos, datasets: [{ label: 'Precisión (%)', data: window.precisionData, backgroundColor: ['#00D4FF', '#00D4FF80', '#7B61FF', '#7B61FF80'], borderRadius: 8 }] },
                options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
            });
        }
        // Gráfico 2: Tiempo
        if (document.getElementById('chartTiempo') && window.tiempoData) {
            new Chart(document.getElementById('chartTiempo'), {
                type: 'bar', data: { labels: window.grupos, datasets: [{ label: 'Tiempo (segundos)', data: window.tiempoData, backgroundColor: ['#00D4FF', '#00D4FF80', '#7B61FF', '#7B61FF80'], borderRadius: 8 }] },
                options: { responsive: true }
            });
        }
        // Gráfico 3: SUS
        if (document.getElementById('chartSUS') && window.susData) {
            new Chart(document.getElementById('chartSUS'), {
                type: 'bar', data: { labels: window.grupos, datasets: [{ label: 'Puntaje SUS', data: window.susData, backgroundColor: ['#00D4FF', '#00D4FF80', '#7B61FF', '#7B61FF80'], borderRadius: 8 }] },
                options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
            });
        }
        // Gráfico 4: Doughnut (distribución de aciertos)
        const totalAciertos = resultados.filter(r => r.acerto).length;
        const totalIncorrectos = resultados.length - totalAciertos;
        if (document.getElementById('chartDoughnut')) {
            new Chart(document.getElementById('chartDoughnut'), {
                type: 'doughnut', data: { labels: ['✅ Correctos', '❌ Incorrectos'], datasets: [{ data: [totalAciertos, totalIncorrectos], backgroundColor: ['#00D4FF', '#FF375F'] }] },
                options: { responsive: true }
            });
        }
        // Gráfico 5: Cargas cognitivas
        if (document.getElementById('chartCargas') && window.cargasData) {
            new Chart(document.getElementById('chartCargas'), {
                type: 'bar', data: { labels: window.cargasData.labels, datasets: [
                    { label: 'Carga Intrínseca', data: window.cargasData.intrínseca, backgroundColor: '#00D4FF' },
                    { label: 'Carga Extrínseca', data: window.cargasData.extrínseca, backgroundColor: '#FFAA00' },
                    { label: 'Carga Germana', data: window.cargasData.germana, backgroundColor: '#7B61FF' }
                ] }, options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }
        // Gráfico 6: Correlación confianza vs precisión (scatter)
        if (document.getElementById('chartCorrelacion') && window.correlacionPuntos && window.correlacionPuntos.length > 0) {
            let r = calcularCorrelacion(window.correlacionPuntos.map(p=>p.confianza), window.correlacionPuntos.map(p=>p.precision));
            new Chart(document.getElementById('chartCorrelacion'), {
                type: 'scatter', data: { datasets: [{ label: 'Estudiantes', data: window.correlacionPuntos.map(p => ({ x: p.confianza, y: p.precision })), backgroundColor: '#00D4FF' }] },
                options: { responsive: true, scales: { x: { title: { display: true, text: 'Confianza (%)' }, min: 0, max: 100 }, y: { title: { display: true, text: 'Precisión (%)' }, min: 0, max: 100 } }, plugins: { tooltip: { callbacks: { label: (ctx) => `Confianza: ${ctx.raw.x}%, Precisión: ${ctx.raw.y}%` } } } }
            });
            document.getElementById('chartCorrelacion').insertAdjacentHTML('afterend', `<div class="stat-card">📊 r de Pearson = ${r.r} (p = ${r.p})</div>`);
        }
        // Gráfico 7: Evolución
        if (document.getElementById('chartEvolucion') && window.evolucionData) {
            new Chart(document.getElementById('chartEvolucion'), {
                type: 'line', data: { labels: window.evolucionData.labels, datasets: [
                    { label: 'Espécimen 1', data: window.evolucionData.precision1, borderColor: '#00D4FF', backgroundColor: 'transparent', tension: 0.3 },
                    { label: 'Espécimen 2', data: window.evolucionData.precision2, borderColor: '#7B61FF', backgroundColor: 'transparent', tension: 0.3 }
                ] }, options: { responsive: true, scales: { y: { beginAtZero: true, max: 100, title: { display: true, text: 'Precisión (%)' } } } }
            });
        }
    }

    function calcularCorrelacion(x, y) {
        if (x.length < 2) return { r: 0, p: 1 };
        const n = x.length;
        const sumX = x.reduce((a,b)=>a+b,0);
        const sumY = y.reduce((a,b)=>a+b,0);
        const sumXY = x.reduce((a,b,i)=>a + b * y[i],0);
        const sumX2 = x.reduce((a,b)=>a + b*b,0);
        const sumY2 = y.reduce((a,b)=>a + b*b,0);
        const r = (n * sumXY - sumX * sumY) / Math.sqrt((n * sumX2 - sumX*sumX) * (n * sumY2 - sumY*sumY));
        let p = 1;
        if (n > 2) { const t = r * Math.sqrt((n-2) / (1 - r*r)); p = 2 * (1 - jStat.studentt.cdf(Math.abs(t), n-2)); }
        return { r: r.toFixed(3), p: p < 0.001 ? '< 0.001' : p.toFixed(4) };
    }
</script>
</body>
</html>
