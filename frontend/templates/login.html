<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clave Linepithema</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0A0E17;
            color: #E0E0E0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: #121826;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #00D4FF40;
            width: 380px;
            max-width: 90%;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00D4FF, #7B61FF);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8rem;
        }
        .subtitle {
            text-align: center;
            color: #A0A0B0;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #00D4FF;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            background: #1A1F36;
            border: 2px solid #1A1F36;
            border-radius: 10px;
            color: #E0E0E0;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #00D4FF;
            background: #121826;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #00D4FF, #7B61FF);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .register-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #00D4FF30;
        }
        a { color: #00D4FF; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .error-message, .success-message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            display: none;
            font-size: 0.9rem;
        }
        .error-message {
            background: #FF375F20;
            color: #FF375F;
            border: 1px solid #FF375F40;
        }
        .success-message {
            background: #00D4FF20;
            color: #00D4FF;
            border: 1px solid #00D4FF40;
        }
        .loading {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-info {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: #606070;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔬 Clave Taxonómica Linepithema</h1>
        <div class="subtitle">Iniciar sesión para comenzar</div>

        <div class="form-group">
            <label>👤 Nombre de usuario</label>
            <input type="text" id="usuario" placeholder="Ej: estudiante_biologia"
                   autocomplete="username" required>
        </div>
        <div class="form-group">
            <label>🔑 Contraseña</label>
            <input type="password" id="contrasena" placeholder="Ingresa tu contraseña"
                   autocomplete="current-password" required>
        </div>

        <button id="loginBtn" onclick="login()">Ingresar</button>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <div class="register-link">
            ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>
        </div>
        <div class="footer-info">
            Estudio de investigación - Maestría TIAE<br>
            Universidad Pedagógica Nacional
        </div>
    </div>

    <script>
        // Permitir Enter en cualquier campo
        ['usuario', 'contrasena'].forEach(id => {
            document.getElementById(id).addEventListener('keypress', e => {
                if (e.key === 'Enter') login();
            });
        });

        // Verificar sesión activa al cargar — sin localStorage
        async function verificarSesionActiva() {
            try {
                const res = await fetch('/api/verificar_sesion');
                if (res.ok) {
                    const data = await res.json();
                    if (data.activa) {
                        redirigirSegunGrupo(data.grupo);
                    }
                }
            } catch (e) { /* sin sesión, continuar normalmente */ }
        }

        async function login() {
            const usuario = document.getElementById('usuario').value.trim();
            const contrasena = document.getElementById('contrasena').value;
            const btn = document.getElementById('loginBtn');

            if (!usuario) { mostrarError('Ingresa tu nombre de usuario'); return; }
            if (!contrasena) { mostrarError('Ingresa tu contraseña'); return; }

            btn.innerHTML = '<span class="loading"></span> Ingresando...';
            btn.disabled = true;
            ocultarMensajes();

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, contrasena })
                });
                const data = await res.json();

                if (res.ok) {
                    mostrarExito('✅ ' + data.mensaje);
                    setTimeout(() => redirigirSegunGrupo(data.grupo), 1200);
                } else {
                    mostrarError('❌ ' + (data.error || 'Credenciales inválidas'));
                    btn.innerHTML = 'Ingresar';
                    btn.disabled = false;
                    document.getElementById('contrasena').value = '';
                    document.getElementById('contrasena').focus();
                }
            } catch (e) {
                mostrarError('❌ Error de conexión con el servidor');
                btn.innerHTML = 'Ingresar';
                btn.disabled = false;
            }
        }

        function redirigirSegunGrupo(grupo) {
            const rutas = {
                '2D':     '/clave_2d',
                '2D_META':'/clave_2d_meta',
                '3D':     '/clave_3d',
                '3D_META':'/clave_3d_meta'
            };
            window.location.href = rutas[grupo] || '/dashboard';
        }

        function mostrarError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function mostrarExito(msg) {
            const el = document.getElementById('successMessage');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        function ocultarMensajes() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        verificarSesionActiva();
    </script>
</body>
</html>
