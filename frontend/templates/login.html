<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clave Linepithema</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0A0E17;
            color: #E0E0E0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: #121826;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #00D4FF40;
            width: 380px;
            max-width: 90%;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00D4FF, #7B61FF);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8rem;
        }
        .subtitle {
            text-align: center;
            color: #A0A0B0;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #00D4FF;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            background: #1A1F36;
            border: 2px solid #1A1F36;
            border-radius: 10px;
            color: #E0E0E0;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #00D4FF;
            background: #121826;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #00D4FF, #7B61FF);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3);
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .register-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #00D4FF30;
        }
        a { color: #00D4FF; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .error-message, .success-message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            display: none;
            font-size: 0.9rem;
        }
        .error-message {
            background: #FF375F20;
            color: #FF375F;
            border: 1px solid #FF375F40;
        }
        .success-message {
            background: #00D4FF20;
            color: #00D4FF;
            border: 1px solid #00D4FF40;
        }
        .loading {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-info {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: #606070;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔬 Clave Taxonómica Linepithema</h1>
        <div class="subtitle">Iniciar sesión para comenzar</div>

        <div class="form-group">
            <label>👤 Nombre completo o correo institucional</label>
            <input type="text" id="usuario" placeholder="Tu nombre completo o tu correo institucional"
                   autocomplete="username" required>
        </div>
        <div class="form-group">
            <label>🔑 Contraseña</label>
            <input type="password" id="contrasena" placeholder="Ingresa tu contraseña"
                   autocomplete="current-password" required>
        </div>

        <button id="loginBtn" onclick="login()">Ingresar</button>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <div class="register-link">
            ¿No tienes cuenta? <a href="/registro">Regístrate aquí</a>
        </div>
        <div class="footer-info">
            Estudio de investigación - Maestría TIAE<br>
            Universidad Pedagógica Nacional
        </div>
    </div>

    <script>
        // Permitir Enter en cualquier campo
        ['usuario', 'contrasena'].forEach(id => {
            document.getElementById(id).addEventListener('keypress', e => {
                if (e.key === 'Enter') login();
            });
        });

        // Verificar sesión activa al cargar — sin localStorage
        async function verificarSesionActiva() {
            try {
                const res = await fetch('/api/verificar_sesion');
                if (res.ok) {
                    const data = await res.json();
                    if (data.activa) {
                        redirigirSegunGrupo(data.grupo);
                    }
                }
            } catch (e) { /* sin sesión, continuar normalmente */ }
        }

        async function login() {
            const usuario = document.getElementById('usuario').value.trim();
            const contrasena = document.getElementById('contrasena').value;
            const btn = document.getElementById('loginBtn');

            if (!usuario) { mostrarError('Ingresa tu nombre completo o tu correo institucional'); return; }
            if (!contrasena) { mostrarError('Ingresa tu contraseña'); return; }

            btn.innerHTML = '<span class="loading"></span> Ingresando...';
            btn.disabled = true;
            ocultarMensajes();

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, contrasena })
                });
                const data = await res.json();

                if (res.ok) {
                    mostrarBienvenida(data);
                } else {
                    mostrarError('❌ ' + (data.error || 'Credenciales inválidas'));
                    btn.innerHTML = 'Ingresar';
                    btn.disabled = false;
                    document.getElementById('contrasena').value = '';
                    document.getElementById('contrasena').focus();
                }
            } catch (e) {
                mostrarError('❌ Error de conexión con el servidor');
                btn.innerHTML = 'Ingresar';
                btn.disabled = false;
            }
        }


        // ===== Bienvenida: saluda por su nombre y explica qué se hará en la plataforma =====
        function escaparHtml(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        async function mostrarBienvenida(data) {
            let estado = { codigo: 'sin_iniciar', puede_iniciar: true, reanudar_encuestas: false };
            try { const r = await fetch('/api/experimento/estado'); if (r.ok) estado = await r.json(); } catch (e) { /* se muestra la bienvenida general */ }

            const grupo = data.grupo || '';
            const es3d = grupo.startsWith('3D'), conMeta = grupo.endsWith('_META');
            const material = grupo ? (es3d ? 'modelos 3D' : 'fotografías 2D') : 'fotografías o modelos 3D';
            const nombre = escaparHtml(data.usuario || '');

            let titulo = `¡Hola, ${nombre}!`, cuerpo = '', destino = '/dashboard', boton = 'Continuar';
            const aviso = `<div style="background:#FFB02018;border:2px solid #FFB020;border-radius:12px;padding:14px;margin:16px 0;font-size:0.9rem;line-height:1.5;">
                <strong style="color:#FFB020;">⚠️ Importante:</strong> el ejercicio solo se puede realizar <strong>una vez</strong>.
                No cierres ni recargues la ventana: si la cierras, no podrás volver a ingresar a las descargas ni repetirlo.</div>`;

            if (!data.grupo && data.rol !== 'pruebas') {
                cuerpo = `<p style="line-height:1.6;">Tu cuenta todavía no tiene un grupo asignado. Cuando el investigador te lo asigne podrás comenzar. Mientras tanto puedes revisar tu panel.</p>`;
            } else if (estado.reanudar_encuestas) {
                cuerpo = `<p style="line-height:1.6;">Ya terminaste las dos identificaciones. Solo te faltan las <strong>encuestas finales</strong>; con ellas podrás ver tus resultados y descargar tu certificado.</p>`;
                destino = '/clave_' + grupo.toLowerCase(); boton = 'Ir a las encuestas';
            } else if (!estado.puede_iniciar) {
                cuerpo = `<p style="line-height:1.6;">Tu ejercicio ya quedó registrado y solo puede hacerse una vez. Puedes revisar tus resultados${estado.codigo === 'completado' ? ' y descargar tu certificado' : ''} en tu panel.</p>
                          ${estado.codigo === 'abandonado' ? '<p style="color:#FFB020;line-height:1.6;">Si cerraste la ventana antes de terminar, avisa al investigador para que revise tu caso.</p>' : ''}`;
                boton = 'Ir a mi panel';
            } else {
                destino = grupo ? '/clave_' + grupo.toLowerCase() : '/dashboard';
                const pasos = [
                    `<strong>Descargar tres materiales de apoyo</strong>: la clave original, el glosario con ${es3d ? 'capturas del modelo 3D' : 'fotografías'} y la imagen de los pines. Son obligatorios para continuar.`,
                    `<strong>Orientación breve</strong>: repasarás cada carácter de la clave con ejemplos.`,
                    `<strong>Identificar 2 especímenes</strong> con la clave, usando ${material}.`,
                    conMeta ? `<strong>Reflexionar sobre tu estrategia</strong> con preguntas cortas antes, durante y después de cada identificación.` : '',
                    `<strong>Responder dos encuestas cortas</strong> y dejar un comentario libre.`,
                    `<strong>Ver tus resultados</strong> y descargar tu certificado.`
                ].filter(Boolean);
                cuerpo = `<p style="line-height:1.6;">Bienvenido/a a la plataforma de identificación de hormigas del género <em>Linepithema</em>. Esto es lo que vamos a hacer:</p>
                    <ol style="line-height:1.6;padding-left:20px;font-size:0.92rem;">${pasos.map(p => `<li style="margin-bottom:6px;">${p}</li>`).join('')}</ol>${aviso}`;
                boton = 'Entendido, comenzar';
            }

            const ov = document.createElement('div');
            ov.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(5,7,12,0.97);overflow-y:auto;padding:20px 12px;display:flex;justify-content:center;align-items:flex-start;';
            ov.innerHTML = `<div style="background:#121826;border:2px solid #00D4FF60;border-radius:20px;padding:26px;max-width:560px;width:100%;color:#E0E0E0;margin:auto;box-sizing:border-box;">
                <h2 style="color:#00D4FF;margin:0 0 10px;">${titulo}</h2>${cuerpo}
                <button id="btnBienvenida" style="width:100%;padding:14px;margin-top:6px;border:none;border-radius:12px;background:linear-gradient(45deg,#00D4FF,#7B61FF);color:#fff;font-weight:700;font-size:1.02rem;cursor:pointer;">${boton}</button></div>`;
            document.body.appendChild(ov);
            document.getElementById('btnBienvenida').onclick = () => { window.location.href = destino; };
        }

        function redirigirSegunGrupo(grupo) {
            const rutas = {
                '2D':     '/clave_2d',
                '2D_META':'/clave_2d_meta',
                '3D':     '/clave_3d',
                '3D_META':'/clave_3d_meta'
            };
            window.location.href = rutas[grupo] || '/dashboard';
        }

        function mostrarError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function mostrarExito(msg) {
            const el = document.getElementById('successMessage');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        function ocultarMensajes() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        verificarSesionActiva();
    </script>
</body>
</html>
